services:
  navidrome:
    image: deluan/navidrome:0.59.0
    container_name: navidrome
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "192.168.31.2:4533:4533"
    environment:
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - TZ=Europe/Prague
    volumes:
      - /srv/apps/navidrome:/data
      - /srv/library/music:/music:ro
