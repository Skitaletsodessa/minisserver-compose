# Task 23 Phase A: the server is a Tailscale exit node (advertised with `tailscale set --advertise-exit-node`,
# approved in the admin console). Exit nodes need IP forwarding. IPv4 forwarding is already 1 because of Docker;
# stated explicitly so it survives Docker being removed. IPv6 forwarding is for Tailscale's own fd7a:: addresses
# (the house has no IPv6 uplink, router IPv6 = none, so no router advertisements are affected).
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
