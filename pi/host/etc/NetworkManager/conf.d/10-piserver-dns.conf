# Task 21 hard rule 1: the Pi's own resolver must not depend on the server's AdGuard Home
# (a server outage would take the replica's NTP/DoH name resolution down with it).
# Plain DNS to Cloudflare/Google works from this network; Quad9 port 53 does not (2026-10-02).
[global-dns]
searches=

[global-dns-domain-*]
servers=1.1.1.1,8.8.8.8
