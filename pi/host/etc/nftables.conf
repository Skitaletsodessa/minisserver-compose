#!/usr/sbin/nft -f
# Task 22: default-deny inbound for the Pi. Only this table is managed here - Docker's own
# iptables-nft tables are left alone (no "flush ruleset"). Outbound is unrestricted.
# DNS (53) from the LAN is for the Task 21 AdGuard replica.
table inet piserver
delete table inet piserver
table inet piserver {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    udp sport 67 udp dport 68 accept
    ip saddr 192.168.31.0/24 tcp dport 22 accept
    ip saddr 192.168.31.0/24 meta l4proto { tcp, udp } th dport 53 accept   # Task 21: the AdGuard replica
    iifname "tailscale0" tcp dport 22 accept
  }
}
