services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls476
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Prague
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - /srv/staging:/staging
      - /srv/library:/library

volumes:
  qbittorrent-config:
