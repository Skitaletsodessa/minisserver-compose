# Task 27 schedule service (ADR 1). network_mode: host because Home Assistant listens on loopback only and is meant to stay that way;
# the bind address is therefore ONE explicit line (PORTAL_BIND) that the code refuses to change to anything but loopback, and every
# start is followed by an `ss` assertion (portal-check-bind). Caddy publishes the tailnet-only site minisserver.tail6bf4d5.ts.net:16443.
# The service never talks to HA or Docker: it writes files under /data/out; the host-side applier (applier/) acts on them.
services:
  portal-schedules:
    build: .
    image: portal-schedules:local
    container_name: portal-schedules
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=Europe/Prague
      - PORTAL_BIND=127.0.0.1
      - PORTAL_PORT=16444
      - PORTAL_DATA=/data
    volumes:
      - /srv/apps/portal/schedules:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:16444/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
