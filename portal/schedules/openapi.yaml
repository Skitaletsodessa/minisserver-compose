openapi: 3.1.0
info:
  title: portal-schedules
  version: 1.0.0
  description: >
    The single source of truth for schedules (Task 27, ADR 1-3). Loopback + Caddy tailnet only.
    Every write is validated against the entity's guardrails and REJECTED (422) when it violates them - nothing is clamped.
    Spec first: contract tests check every response of the running service against this file.
servers:
  - url: https://minisserver.tail6bf4d5.ts.net:16443
security:
  - bearer: []
paths:
  /v1/health:
    get:
      operationId: health
      summary: Liveness (no token) or full health (with a token)
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /v1/entities:
    get:
      operationId: listEntities
      responses:
        "400": {$ref: "#/components/responses/Error"}
        "200": {description: entities, content: {application/json: {schema: {type: object, required: [entities], properties: {entities: {type: array, items: {$ref: "#/components/schemas/Entity"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    post:
      operationId: addPlug
      summary: "Admin only. Adds a smart plug as an entity: copies guardrails, flags and windows of an existing plug (`like`). Starts UNMANAGED (nothing is rendered into Home Assistant until PATCH managed=true)"
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id, name, ha_target, like], additionalProperties: false, properties: {id: {type: string}, name: {type: string}, ha_target: {type: string, pattern: "^switch[.][a-z0-9_]+$"}, like: {type: string}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Entity"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/entities/{id}:
    patch:
      operationId: patchEntity
      summary: Admin only. name, flags, managed (the cutover switch), ha_target (a plug whose switch was renamed in Home Assistant)
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {name: {type: string}, flags: {$ref: "#/components/schemas/Flags"}, managed: {type: boolean}}}}}
      responses:
        "200": {description: updated, content: {application/json: {schema: {$ref: "#/components/schemas/Entity"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/entities/{id}/guardrails:
    put:
      operationId: putGuardrails
      summary: Admin only. Rejected when the current schedule would violate the new numbers
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Guardrails"}}}
      responses:
        "200": {description: updated, content: {application/json: {schema: {$ref: "#/components/schemas/Entity"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/schedules:
    get:
      operationId: listSchedules
      responses:
        "200": {description: schedules, content: {application/json: {schema: {type: object, required: [schedules], properties: {schedules: {type: array, items: {$ref: "#/components/schemas/Schedule"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}:
    get:
      operationId: getSchedule
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      responses:
        "200":
          description: the schedule; the ETag is its version
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleWithGuardrails"}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: putSchedule
      summary: Replace the rules. If-Match (the ETag you read) is required.
      parameters:
        - {$ref: "#/components/parameters/EntityId"}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], additionalProperties: false, properties: {rules: {type: array, items: {$ref: "#/components/schemas/Rule"}}}}}}
      responses:
        "200":
          description: stored (changed=false when the rules were identical)
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/PutResult"}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "412": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "428": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}/preview:
    post:
      operationId: previewSchedule
      summary: Validate, show the diff and the next 7 days of edges; changes nothing
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], properties: {rules: {type: array, items: {$ref: "#/components/schemas/Rule"}}}}}}
      responses:
        "200": {description: preview, content: {application/json: {schema: {$ref: "#/components/schemas/Preview"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}/undo:
    post:
      operationId: undoSchedule
      summary: Revert the last rule change as a new change (guardrails apply)
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      responses:
        "200":
          description: reverted
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/PutResult"}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/exceptions:
    get:
      operationId: listExceptions
      parameters: [{name: entity, in: query, schema: {type: string}}]
      responses:
        "200": {description: exceptions, content: {application/json: {schema: {type: object, required: [exceptions], properties: {exceptions: {type: array, items: {$ref: "#/components/schemas/Exception"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    post:
      operationId: addException
      summary: "skip_date (date) or override_until (until, state); override is model and API only in step a"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExceptionRequest"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/exceptions/{xid}:
    delete:
      operationId: deleteException
      parameters: [{name: xid, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: deleted}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/runs:
    get:
      operationId: listRuns
      summary: Timed runs ("run for N minutes"), newest data first by start. active=1 lists only the running ones, otherwise the last 36 hours too
      parameters: [{name: entity, in: query, schema: {type: string}}, {name: active, in: query, schema: {type: string, enum: ["1", "true", "0"]}}]
      responses:
        "200": {description: runs, content: {application/json: {schema: {type: object, required: [runs], properties: {runs: {type: array, items: {$ref: "#/components/schemas/Run"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    post:
      operationId: startRun
      summary: >
        Accepts a timed run of a plug: the guardrails are checked as for a schedule (max_on_minutes counted from the real start including extensions,
        the allowed time-of-day range, min_gap_minutes after the previous run, no overlap with a scheduled window; rejected with the reasons, never clamped).
        The end is rendered into Home Assistant (generated automation); the run is `armed` once HA has loaded it. The CALLER switches the plug on, and
        should do so only when armed.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [entity_id, minutes], additionalProperties: false, properties: {entity_id: {type: string}, minutes: {type: integer, minimum: 1}}}}}
      responses:
        "201": {description: accepted, content: {application/json: {schema: {$ref: "#/components/schemas/Run"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}:
    get:
      operationId: getRun
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      responses:
        "200": {description: the run, content: {application/json: {schema: {$ref: "#/components/schemas/Run"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    delete:
      operationId: cancelRun
      summary: "Ends the run now (status cancelled; with withdraw=1 status withdrawn, i.e. accepted but the plug was never switched on, so it does not count for the gap between runs). The caller switches the plug off; the end-of-run automation is withdrawn from HA"
      parameters: [{$ref: "#/components/parameters/EntityId"}, {name: withdraw, in: query, schema: {type: string, enum: ["1", "true", "0"]}}]
      responses:
        "200": {description: the cancelled run, content: {application/json: {schema: {$ref: "#/components/schemas/Run"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/runs/{id}/extend:
    post:
      operationId: extendRun
      summary: >
        Adds minutes to an active run. The total is counted from the run's REAL start and must stay within the guardrails; rejected when less than 90 s are
        left (the new end could not be armed in HA before the old one passes).
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [minutes], additionalProperties: false, properties: {minutes: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: the extended run, content: {application/json: {schema: {$ref: "#/components/schemas/Run"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child:
    get:
      operationId: listChildren
      summary: "The children's devices (Task 29): windows, guardrails, exceptions, per-child domain lists and the computed status of each"
      responses:
        "200": {description: children, content: {application/json: {schema: {type: object, required: [children], properties: {children: {type: array, items: {$ref: "#/components/schemas/ChildDeviceFull"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    post:
      operationId: addChildDevice
      summary: "Admin only. Adds a child device (it starts with the windows of `like`, else the standard ones, the proposed guardrails and no exceptions). House infrastructure (router, this server, the Pi) is refused as a device: a catch-all there would cut the house's DNS"
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, ip], additionalProperties: false, properties: {name: {type: string, maxLength: 40}, ip: {type: string}, mac: {type: string}, like: {type: string}, label: {type: string, maxLength: 40}, icon: {type: string, enum: [phone, tablet, laptop, console, tv, other]}, closed: {type: boolean}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDeviceFull"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/snapshot:
    get:
      operationId: getChildSnapshot
      summary: "The snapshot the host policy job executes from (also written atomically to out/child-policy.json with a checksum on every change)"
      responses:
        "200": {description: snapshot, content: {application/json: {schema: {$ref: "#/components/schemas/ChildSnapshot"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/cutover:
    put:
      operationId: setChildCutover
      summary: "Admin only. Marks the child policy as cut over (the model is the source; a re-import is refused) or rolls that back. Written by tools/child_cutover.py"
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [done], additionalProperties: false, properties: {done: {type: boolean}, note: {type: string}}}}}
      responses:
        "200": {description: state, content: {application/json: {schema: {type: object, required: [cutover], properties: {cutover: {type: [object, "null"]}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/removed:
    get:
      operationId: listRemovedChildren
      summary: "Admin only. Removed child devices that can still be restored (24 h)"
      responses:
        "200": {description: removals, content: {application/json: {schema: {type: object, required: [removed], properties: {removed: {type: array, items: {$ref: "#/components/schemas/ChildRemoval"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/removed/{rid}/restore:
    post:
      operationId: restoreChildDevice
      summary: "Admin only. Re-creates a removed device from its stored definition (same id, windows, guardrails, lists, still-active exceptions) if the id, name, ip and mac are still free"
      parameters: [{name: rid, in: path, required: true, schema: {type: string}}]
      responses:
        "201": {description: restored, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDeviceFull"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/{id}:
    get:
      operationId: getChildDevice
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      responses:
        "200": {description: the device, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDeviceFull"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeChildDevice
      summary: "Admin only. Retires a child device (its catch-all leaves AdGuard at the next job run). The audit row keeps windows, guardrails, lists and exceptions. The last device cannot be removed"
      parameters: [{$ref: "#/components/parameters/EntityId"}, {name: forget, in: query, required: false, schema: {type: string, enum: ["1", "true"]}, description: "roll back a failed add: do not keep the 24 h undo record"}]
      responses:
        "200": {description: removed; the definition is kept 24 h for the undo, content: {application/json: {schema: {$ref: "#/components/schemas/ChildRemoval"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/{id}/exceptions:
    post:
      operationId: addChildException
      summary: "A time-boxed exception: target youtube|roblox|all (Maps is always open, no exception: 422 maps_always_open), minutes XOR until_end_of_day. By default NO cap and NO ceiling (today's behaviour: a minute up to the end of the day, 23:59, everything included; crossing midnight is refused); the optional guardrails max_exception_minutes, exception_latest_end, all_latest_end apply only when an admin sets them (rejected with reasons, never clamped). Replaces an active exception of the same target"
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [target], additionalProperties: false, properties: {target: {type: string, enum: [youtube, roblox, all]}, minutes: {type: integer, minimum: 1}, until_end_of_day: {type: boolean}}}}}
      responses:
        "201": {description: granted, content: {application/json: {schema: {$ref: "#/components/schemas/ChildExceptionRec"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/{id}/exceptions/{xid}:
    delete:
      operationId: cancelChildException
      parameters: [{$ref: "#/components/parameters/EntityId"}, {name: xid, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: cancelled}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/{id}/domains:
    post:
      operationId: addChildDomain
      summary: "Adds a plain domain to this child's allow or deny list. Deny beats allow; adding to one removes it from the other; a deny that would block an always-on host is refused (422 invariant)"
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [kind, domain], additionalProperties: false, properties: {kind: {type: string, enum: [allow, deny]}, domain: {type: string}}}}}
      responses:
        "200": {description: lists after the change, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDomains"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeChildDomain
      parameters: [{$ref: "#/components/parameters/EntityId"}, {name: kind, in: query, required: true, schema: {type: string, enum: [allow, deny]}}, {name: domain, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: lists after the change, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDomains"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child/{id}/domains/undo:
    post:
      operationId: undoChildDomain
      summary: Restores the lists as they were before the last domain change of this child, as a new change
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      responses:
        "200": {description: lists after the undo, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDomains"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/effective:
    get:
      operationId: effective
      summary: What the schedule says at a time, and the next edge
      parameters:
        - {name: entity, in: query, required: true, schema: {type: string}}
        - {name: at, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: effective state, content: {application/json: {schema: {$ref: "#/components/schemas/Effective"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/audit:
    get:
      operationId: audit
      parameters:
        - {name: entity, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: before, in: query, schema: {type: integer}}
      responses:
        "200": {description: newest first, content: {application/json: {schema: {type: object, required: [audit], properties: {audit: {type: array, items: {$ref: "#/components/schemas/AuditRow"}}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child-policy:
    get:
      operationId: getChildPolicy
      summary: The modelled child policy (devices, windows, domain lists). Read-only in step (a). Household sees no domain lists
      responses:
        "200": {description: policy, content: {application/json: {schema: {$ref: "#/components/schemas/ChildPolicy"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child-policy/import:
    put:
      operationId: importChildPolicy
      summary: "Admin only. Replaces the MODELLED policy (devices, windows, lists, still-active exceptions); AdGuard is never touched. dry_run=1 validates and reports without storing. Refused (403) after the cutover"
      parameters: [{name: dry_run, in: query, schema: {type: string, enum: ["1", "true", "0"]}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ChildPolicyImport"}}}
      responses:
        "200": {description: imported, content: {application/json: {schema: {type: object, required: [devices, lists, sha256], properties: {devices: {type: array, items: {type: string}}, lists: {type: object}, per_child_lists: {type: object}, exceptions_migrated: {type: integer}, dry_run: {type: boolean}, always_services: {type: array, items: {type: string}}, sha256: {type: string}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/child-policy/render:
    post:
      operationId: renderChildPolicy
      summary: Pure preview of the AdGuard user_rules block for a moment; the caller supplies AdGuard's service domains. Nothing is sent anywhere
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [service_domains], properties: {at: {type: string}, service_domains: {type: object}, overrides: {type: array, items: {type: object}}}}}}
      responses:
        "200": {description: managed lines, content: {application/json: {schema: {type: object, required: [at, lines], properties: {at: {type: string}, lines: {type: array, items: {type: string}}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/tokens:
    get:
      operationId: listTokens
      summary: Admin only. Never returns a secret
      responses:
        "200": {description: tokens, content: {application/json: {schema: {type: object, required: [tokens], properties: {tokens: {type: array, items: {$ref: "#/components/schemas/Token"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createToken
      summary: Admin only. The secret is returned ONCE
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, role], properties: {name: {type: string}, role: {type: string, enum: [admin, household, readonly]}, expires: {type: [string, "null"]}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {type: object, required: [id, name, role, token], properties: {id: {type: string}, name: {type: string}, role: {type: string}, token: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/tokens/{id}:
    delete:
      operationId: revokeToken
      parameters: [{$ref: "#/components/parameters/EntityId"}]
      responses:
        "204": {description: revoked}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    EntityId: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            problems: {type: array, items: {$ref: "#/components/schemas/Problem"}}
    Problem:
      type: object
      required: [code, field, message]
      properties: {code: {type: string}, field: {type: string}, message: {type: string}}
    Flags:
      type: object
      additionalProperties: false
      properties: {household_editable: {type: boolean}, guardrails_proposed: {type: boolean, description: "child policy: the guardrail numbers are proposals Ivan has not confirmed yet"}}
    Guardrails:
      type: object
      additionalProperties: false
      properties:
        max_on_minutes: {type: integer, minimum: 1, maximum: 1440}
        max_level: {type: integer, minimum: 1, maximum: 100}
        min_gap_minutes: {type: integer, minimum: 0, maximum: 1440}
        allowed_from: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        allowed_to: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        max_triggers_per_day: {type: integer, minimum: 1, maximum: 24}
        max_open_minutes_per_day: {type: integer, minimum: 1, maximum: 1440}
        max_exception_minutes: {type: integer, minimum: 1, maximum: 1440}
        exception_latest_end: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        all_latest_end: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
    Entity:
      type: object
      required: [id, kind, name, ha_target, managed, flags, guardrails]
      properties:
        id: {type: string}
        kind: {type: string, enum: [plug, vacuum_plan, child_window, dimmer]}
        name: {type: string}
        ha_target: {type: [string, "null"]}
        managed: {type: boolean, description: "true = rendered into the generated HA config (cutover done)"}
        flags: {$ref: "#/components/schemas/Flags"}
        guardrails: {$ref: "#/components/schemas/Guardrails"}
        meta: {type: object, description: "device facts (ip, mac) for child_window entities"}
    ChildDevice:
      type: object
      required: [id, name, ip, rules]
      properties:
        id: {type: string}
        name: {type: string}
        ip: {type: string}
        mac: {type: [string, "null"]}
        rules: {type: array, items: {$ref: "#/components/schemas/Rule"}}
    ChildPolicy:
      type: object
      required: [devices, always_services]
      properties:
        devices: {type: array, items: {$ref: "#/components/schemas/ChildDevice"}}
        always_services: {type: array, items: {type: string}}
        lists: {type: object}
    ChildPolicyImport:
      type: object
      required: [devices]
      properties:
        devices: {type: array, items: {$ref: "#/components/schemas/ChildDevice"}}
        lists: {type: object}
        exceptions: {type: array, description: "the still-active exceptions of the old runtime file: {client (ip), target, expires, created}", items: {type: object}}
        always_services: {type: array, items: {type: string}}
    Rule:
      type: object
      required: [id, days, start]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z0-9_]{1,24}$"}
        days: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 7}}
        start: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        end: {type: [string, "null"], pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"}
        level: {type: [integer, "null"]}
        variables: {type: [object, "null"]}
    Schedule:
      type: object
      required: [entity, version, tz, updated_at, rules]
      properties:
        entity: {type: string}
        version: {type: integer, minimum: 1}
        tz: {type: string}
        updated_at: {type: string}
        rules: {type: array, items: {$ref: "#/components/schemas/Rule"}}
    ScheduleWithGuardrails:
      allOf:
        - {$ref: "#/components/schemas/Schedule"}
        - type: object
          required: [guardrails]
          properties: {guardrails: {$ref: "#/components/schemas/Guardrails"}}
    PutResult:
      allOf:
        - {$ref: "#/components/schemas/Schedule"}
        - type: object
          required: [changed]
          properties: {changed: {type: boolean}}
    Edge:
      type: object
      required: [at, action, rule]
      properties: {at: {type: string}, action: {type: string, enum: ["on", "off", "trigger"]}, rule: {type: string}}
    Preview:
      type: object
      required: [entity, current_version, valid, problems]
      properties:
        entity: {type: string}
        current_version: {type: integer}
        valid: {type: boolean}
        problems: {type: array, items: {$ref: "#/components/schemas/Problem"}}
        diff:
          type: object
          required: [added, removed, changed]
          properties:
            added: {type: array, items: {$ref: "#/components/schemas/Rule"}}
            removed: {type: array, items: {$ref: "#/components/schemas/Rule"}}
            changed: {type: array, items: {type: object, required: [before, after], properties: {before: {$ref: "#/components/schemas/Rule"}, after: {$ref: "#/components/schemas/Rule"}}}}
        next_7_days: {type: array, items: {$ref: "#/components/schemas/Edge"}}
        open_next_7_days: {type: array, description: "child_window entities: what the windows open over the next 7 days", items: {type: object, required: [from, to, opens], properties: {from: {type: string}, to: {type: string}, opens: {type: array, items: {type: string}}}}}
    ExceptionRequest:
      type: object
      required: [entity_id, kind]
      additionalProperties: false
      properties:
        entity_id: {type: string}
        kind: {type: string, enum: [skip_date, override_until]}
        date: {type: string}
        until: {type: string}
        state: {type: string, enum: ["on", "off"]}
    Actor:
      type: object
      required: [token, name, role]
      properties: {token: {type: string}, name: {type: string}, role: {type: string}, ip: {type: string}, gateway: {type: boolean}, acting: {type: object, description: "Task 28: who the gateway acted for (X-Acting-User, accepted only from gateway tokens)", properties: {person: {type: string}, phone: {type: string}}}}
    Exception:
      type: object
      required: [id, entity, kind, created_by, created_at]
      properties:
        id: {type: string}
        entity: {type: string}
        kind: {type: string}
        date: {type: [string, "null"]}
        until: {type: [string, "null"]}
        state: {type: [string, "null"]}
        created_by: {$ref: "#/components/schemas/Actor"}
        created_at: {type: string}
    Run:
      type: object
      required: [id, entity, status, started_at, ends_at, minutes_total, started_by, remaining_s, armed]
      properties:
        id: {type: string}
        entity: {type: string}
        status: {type: string, enum: [active, ended, cancelled, withdrawn]}
        started_at: {type: string}
        ends_at: {type: string, description: "a whole minute; HA switches the plug off there"}
        ended_at: {type: [string, "null"]}
        minutes_total: {type: integer, description: "counted from the real start, including extensions"}
        started_by: {type: string}
        remaining_s: {type: integer}
        armed: {type: boolean, description: "Home Assistant has loaded a rendered set that contains this run: its end is enforced by HA itself"}
    ChildExceptionRec:
      type: object
      required: [id, entity, target, created_at, expires_at, expires_ts, status, created_by, remaining_s]
      properties:
        id: {type: string}
        entity: {type: string}
        target: {type: string, enum: [youtube, roblox, all]}
        created_at: {type: string}
        expires_at: {type: string}
        expires_ts: {type: integer}
        status: {type: string}
        created_by: {type: string}
        remaining_s: {type: integer}
    ChildDomains:
      type: object
      required: [allow, deny]
      properties:
        allow: {type: array, items: {type: string}}
        deny: {type: array, items: {type: string}}
    ChildModelStatus:
      type: object
      required: [state, open_services, open_until, opens_at, exceptions]
      properties:
        state: {type: string, enum: [open, closed, restricted]}
        open_services: {type: array, items: {type: string}}
        open_until: {type: [string, "null"]}
        opens_at: {type: [string, "null"]}
        exceptions: {type: array, items: {$ref: "#/components/schemas/ChildExceptionRec"}}
    ChildRemoval:
      type: object
      required: [removal_id, child_id, name, removed_at, restorable_until]
      properties:
        removal_id: {type: string}
        child_id: {type: string}
        name: {type: string}
        ip: {type: [string, "null"]}
        removed_at: {type: string}
        restorable_until: {type: string}
        removed_by: {type: [string, "null"]}
    ChildDeviceFull:
      type: object
      required: [id, name, ip, mac, version, tz, rules, guardrails, flags, exceptions, domains, status]
      properties:
        id: {type: string}
        name: {type: string}
        ip: {type: [string, "null"]}
        mac: {type: [string, "null"]}
        version: {type: integer}
        label: {type: string}
        icon: {type: string}
        child: {type: string}
        tz: {type: string}
        updated_at: {type: string}
        rules: {type: array, items: {type: object}}
        guardrails: {$ref: "#/components/schemas/Guardrails"}
        flags: {$ref: "#/components/schemas/Flags"}
        exceptions: {type: array, items: {$ref: "#/components/schemas/ChildExceptionRec"}}
        domains: {$ref: "#/components/schemas/ChildDomains"}
        status: {$ref: "#/components/schemas/ChildModelStatus"}
    ChildSnapshot:
      type: object
      required: [schema, checksum, devices, lists, always_services]
      properties:
        schema: {type: integer}
        checksum: {type: string}
        generated_at: {type: string}
        audit_seq: {type: integer}
        guardrails_proposed: {type: boolean}
        always_services: {type: array, items: {type: string}}
        lists: {type: object}
        devices: {type: array, items: {type: object}}
    Effective:
      type: object
      required: [entity, at, state, source, active_overrides, skipped_today, next_edge]
      properties:
        entity: {type: string}
        at: {type: string}
        state: {type: [string, "null"], enum: ["on", "off", null]}
        source: {type: string, enum: [schedule, override]}
        active_overrides: {type: array, items: {type: string}}
        skipped_today: {type: boolean}
        next_edge: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Edge"}]}
    AuditRow:
      type: object
      required: [seq, ts, actor, action, entity, before, after]
      properties:
        seq: {type: integer}
        ts: {type: string}
        actor: {$ref: "#/components/schemas/Actor"}
        action: {type: string}
        entity: {type: [string, "null"]}
        before: {}
        after: {}
    Token:
      type: object
      required: [id, name, role, created, revoked]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string}
        created: {type: string}
        expires: {type: [string, "null"]}
        last_used: {type: [string, "null"]}
        revoked: {type: boolean}
        gateway: {type: boolean}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        entities: {type: integer}
        audit_seq: {type: integer}
        audit_chain: {type: object, required: [ok, rows], properties: {ok: {type: boolean}, rows: {type: integer}, first_bad_seq: {type: [integer, "null"]}}}
        data_checksum: {type: [string, "null"]}
        publish_error: {type: [string, "null"]}
        render: {type: object, properties: {set_hash: {type: [string, "null"]}, audit_seq: {type: [integer, "null"]}}}
        apply: {type: object}
        child_policy: {type: object, description: "the child-policy snapshot (checksum, devices, cutover) and what the host job last applied"}
        in_sync: {type: boolean}
