{% extends "base.html" %}
{% block title %}{{ t('setup_title') }}{% endblock %}
{% block body %}
<section class="narrow">
  <h1>{{ t('setup_title') }}: {{ person.name }}</h1>
  <p>{{ t('setup_intro') }}</p>
  {% if error %}<p class="msg err" role="alert">{{ error }}</p>{% endif %}
  <p>{{ t('setup_scan') }}</p>
  <div class="qr">{{ qr|safe }}</div>
  <p><code class="seed">{{ seed }}</code></p>
  <form method="post" action="/setup/{{ token }}" autocomplete="off">
    <label>{{ t('setup_password') }}<input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
    <label>{{ t('setup_code') }}<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label>
    <button class="primary" type="submit">{{ t('save') }}</button>
  </form>
</section>
{% endblock %}
