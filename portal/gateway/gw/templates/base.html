<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="csrf" content="{{ csrf }}">
<title>{% block title %}{{ t('app_name') }}{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script type="application/json" id="i18n">{{ i18n_json|safe }}</script>
<script src="/static/app.js" defer></script>
</head>
<body data-page="{{ nav_active }}">
{% if me %}
<header class="top">
  <nav aria-label="{{ t('menu') }}">
    <a href="/home" {% if nav_active == 'home' %}aria-current="page"{% endif %}>{{ t('nav_home') }}</a>
    <a href="/services" {% if nav_active == 'services' %}aria-current="page"{% endif %}>{{ t('nav_services') }}</a>
    {% if me.parent %}<a href="/parental" {% if nav_active == 'parental' %}aria-current="page"{% endif %}>{{ t('nav_parental') }}</a>{% endif %}
    {% if me.role == 'admin' %}
    <a href="/people" {% if nav_active == 'people' %}aria-current="page"{% endif %}>{{ t('nav_people') }}</a>
    <a href="/audit" {% if nav_active == 'audit' %}aria-current="page"{% endif %}>{{ t('nav_audit') }}</a>
    {% endif %}
  </nav>
  <form method="post" action="/logout" class="logout"><input type="hidden" name="csrf" value="{{ csrf }}"><span class="who">{{ me.name }}</span><button type="submit">{{ t('logout') }}</button></form>
</header>
{% endif %}
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
