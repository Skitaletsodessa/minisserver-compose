{% extends "base.html" %}
{% block title %}{{ t('settings') }}{% endblock %}
{% block body %}
<h1>{{ t('editor_title', n=ent.name) }}</h1>
<p><a class="back" href="/home">&larr; {{ t('nav_home') }}</a></p>
<script type="application/json" id="doc">{{ doc_json|safe }}</script>
{% if not can_edit %}<p class="msg warn">{{ t('cannot_edit') }}</p>{% endif %}
<section id="guard" class="meta"></section>
<form id="editor" {% if not can_edit %}data-readonly="yes"{% endif %}>
  <div id="rules"></div>
  <div class="row">
    <button type="button" id="add-rule" {% if not can_edit %}disabled{% endif %}>{{ t('add_rule') }}</button>
    <button type="button" id="preview" {% if not can_edit %}disabled{% endif %}>{{ t('preview') }}</button>
    <button type="button" id="save" class="primary" {% if not can_edit %}disabled{% endif %}>{{ t('save') }}</button>
    <button type="button" id="undo" {% if not can_edit %}disabled{% endif %}>{{ t('undo') }}</button>
  </div>
</form>
<p class="msg" id="editor-msg" role="status" hidden></p>
<section id="preview-box" hidden><h2>{{ t('preview_title') }}</h2><ul id="preview-list"></ul></section>
{% endblock %}
