openapi: 3.1.0
info:
  title: portal-gateway
  version: 1.0.0
  description: >
    The Home Portal gateway (Task 28, ADR 0007). One API for the web UI and the Android app. HA stays the executor and the schedule service stays
    the only writer of schedules: the gateway reads, requests and confirms by read-back. Tailnet only. Every state-changing call carries an
    Idempotency-Key; every error has the shape {error: {code, message, details}}. Spec first: contract tests check every response of the running
    service against this file. Paths marked x-status: planned are RESERVED and have no implementation (they answer 404).
servers:
  - url: https://minisserver.tail6bf4d5.ts.net:17443
security:
  - deviceToken: []
  - session: []
paths:
  /v1/health:
    get:
      operationId: health
      summary: Liveness (no credentials) or details (authenticated)
      security: []
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /v1/auth/login:
    post:
      operationId: login
      summary: Web login (admin needs password + TOTP). Sets a session cookie. Rate-limited per address and per account
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [username, password], additionalProperties: false, properties: {username: {type: string}, password: {type: string}, totp: {type: string}}}}}
      responses:
        "200": {description: logged in, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: "#/components/parameters/Idem"}]
      responses:
        "204": {description: logged out}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/auth/session:
    get:
      operationId: session
      summary: Who am I, and the CSRF token of this session
      responses:
        "200": {description: the session, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/enrol:
    post:
      operationId: enrol
      summary: The app trades a one-time enrolment code for a device token (shown once). No other credential
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EnrolRequest"}}}
      responses:
        "201": {description: enrolled, content: {application/json: {schema: {$ref: "#/components/schemas/EnrolResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/capabilities:
    get:
      operationId: capabilities
      summary: What this caller may do; the app builds its tabs from this
      responses:
        "200": {description: capabilities, content: {application/json: {schema: {$ref: "#/components/schemas/Capabilities"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/people:
    get:
      operationId: listPeople
      summary: Admin only
      responses:
        "200": {description: people, content: {application/json: {schema: {type: object, required: [people], properties: {people: {type: array, items: {$ref: "#/components/schemas/Person"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createPerson
      summary: Admin only. No credentials are created here
      parameters: [{$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PersonCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Person"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/people/{id}:
    patch:
      operationId: patchPerson
      summary: Admin only. role, parent, active, web_login_enabled, name
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {name: {type: string}, role: {type: string, enum: [admin, household, readonly]}, parent: {type: boolean}, active: {type: boolean}, web_login_enabled: {type: boolean}}}}}
      responses:
        "200": {description: updated, content: {application/json: {schema: {$ref: "#/components/schemas/Person"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/people/{id}/enrolment-codes:
    post:
      operationId: createEnrolmentCode
      summary: Admin only. A one-time code (10 min, single use) bound to the person; the code is returned ONCE
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/EnrolmentCode"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/people/{id}/setup-link:
    post:
      operationId: createSetupLink
      summary: Admin only. A one-time link on which the person sets their OWN password and TOTP (web login). Returned ONCE
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "201": {description: created, content: {application/json: {schema: {type: object, required: [url, expires_at], properties: {url: {type: string}, expires_at: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/phones:
    get:
      operationId: listPhones
      summary: Enrolled devices (phones). Admin sees all, everyone else only their own
      responses:
        "200": {description: phones, content: {application/json: {schema: {type: object, required: [phones], properties: {phones: {type: array, items: {$ref: "#/components/schemas/Phone"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/phones/{id}:
    delete:
      operationId: revokePhone
      summary: Revoke a device token. Takes effect on that device's NEXT request and closes its event stream. Admin, or the owner for their own phone
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "204": {description: revoked}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/devices:
    get:
      operationId: listDevices
      summary: The "Дом" cards for smart plugs
      responses:
        "200": {description: devices, content: {application/json: {schema: {type: object, required: [devices, ha_link], properties: {devices: {type: array, items: {$ref: "#/components/schemas/Device"}}, ha_link: {type: string, enum: [ws, poll, down]}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/devices/{id}:
    get:
      operationId: getDevice
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: device, content: {application/json: {schema: {$ref: "#/components/schemas/Device"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: patchDevice
      summary: "Admin only. The editable device data: switch_mode (timed = the On button asks for a duration and a plain ON is refused; plain = ON as before) and household_switchable"
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, minProperties: 1, properties: {switch_mode: {type: string, enum: [timed, plain]}, household_switchable: {type: boolean}}}}}
      responses:
        "200": {description: device, content: {application/json: {schema: {$ref: "#/components/schemas/Device"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/devices/{id}/run:
    post:
      operationId: startRun
      summary: >
        Switch ON for N minutes ("Включить на…"). The schedule service checks the guardrails (max_on_minutes counted from the real start, allowed time of day, gap since the
        last run, no overlap with a scheduled window; 422 with reasons, never clamped) and renders the END into Home Assistant; the gateway switches the plug on only
        after HA has loaded it (armed), then reads the state back. If the end cannot be armed in time nothing is switched on (503 run_not_armed). From then on HA ends
        the run by itself, with the gateway and the schedule service stopped. Refused when the plug is already on (409 already_on) or a run is active (409 run_active).
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [minutes], additionalProperties: false, properties: {minutes: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/RunResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    delete:
      operationId: endRun
      summary: '"Выключить": switches the plug off and reads it back first; only a confirmed OFF closes the run (otherwise it stays and HA ends it at its end)'
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/RunResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/devices/{id}/run/extend:
    post:
      operationId: extendRun
      summary: '"+30 мин": adds minutes to the active run; the total counts from the real start and must stay within the guardrail (422 max_on otherwise); the new end is armed in HA before the answer says confirmed'
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [minutes], additionalProperties: false, properties: {minutes: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/RunResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/devices/{id}/switch:
    post:
      operationId: switchDevice
      summary: Idempotent. Confirmed by reading the state back within a bounded wait; otherwise outcome=unconfirmed with the observed state. Never reported as success on the service call alone
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [on], additionalProperties: false, properties: {on: {type: boolean}}}}}
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/SwitchResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/vacuums:
    get:
      operationId: listVacuums
      summary: Robots and OUR scenarios (the existing HA scripts)
      responses:
        "200": {description: vacuums, content: {application/json: {schema: {type: object, required: [vacuums], properties: {vacuums: {type: array, items: {$ref: "#/components/schemas/Vacuum"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/vacuums/{id}/scenarios/{scenario}/start:
    post:
      operationId: startScenario
      summary: "Runs the existing HA script. Refused when the robot is unavailable or a plan is already running (reason in the error). outcome confirmed = the script is running; the robot itself may take up to about a minute to leave the dock (observed.vacuum is what HA sees)"
      parameters: [{$ref: "#/components/parameters/Id"}, {name: scenario, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/VacuumResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/vacuums/{id}/pause:
    post:
      operationId: pauseVacuum
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/VacuumResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/vacuums/{id}/resume:
    post:
      operationId: resumeVacuum
      summary: "Continues a paused robot (vacuum.start on a paused robot). Refused unless the robot is paused. The plan script that was running when it was paused has already ended, so the robot finishes its current job on its own"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/VacuumResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/vacuums/{id}/dock:
    post:
      operationId: dockVacuum
      summary: "Stops the running plan script (if any) and sends the robot home. For two minutes afterwards a guard sends it home again if it starts anyway (a start command already on its way). Pause while a plan is still starting is treated as dock (action is reported as dock)"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/VacuumResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}:
    get:
      operationId: getSchedule
      summary: Proxy of the schedule service. id = the card's schedule_id
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: rules, guardrails, ETag
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleDoc"}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    put:
      operationId: putSchedule
      summary: Proxy. If-Match required. Guardrail rejections pass through with their codes and details
      parameters: [{$ref: "#/components/parameters/Id"}, {name: If-Match, in: header, required: true, schema: {type: string}}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], additionalProperties: false, properties: {rules: {type: array, items: {type: object}}}}}}
      responses:
        "200":
          description: stored
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleDoc"}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "412": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "428": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}/preview:
    post:
      operationId: previewSchedule
      summary: Proxy. Validate, diff and the next 7 days of edges; changes nothing
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], properties: {rules: {type: array, items: {type: object}}}}}}
      responses:
        "200": {description: preview, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}/undo:
    post:
      operationId: undoSchedule
      summary: Proxy. Reverts the last rule change as a new change
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: reverted, content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleDoc"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/schedules/{id}/exceptions:
    get:
      operationId: listExceptions
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: exceptions, content: {application/json: {schema: {type: object, required: [exceptions], properties: {exceptions: {type: array, items: {type: object}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    post:
      operationId: addException
      summary: Proxy. skip_date {date} or override_until {until, state} (modelled in the schedule service, not enforced in HA in step a)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [kind], properties: {kind: {type: string, enum: [skip_date, override_until]}, date: {type: string}, until: {type: string}, state: {type: string}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/exceptions/{xid}:
    delete:
      operationId: deleteException
      parameters: [{name: xid, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "204": {description: deleted}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/services:
    get:
      operationId: listServices
      summary: Tiles with health badges, filtered by who may see them
      responses:
        "200": {description: tiles, content: {application/json: {schema: {type: object, required: [services], properties: {services: {type: array, items: {$ref: "#/components/schemas/ServiceTile"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/events:
    get:
      operationId: events
      summary: Server-Sent Events. device / vacuum / service / link events; a heartbeat comment every 25 s; Last-Event-ID resumes the last few minutes. A revoked token closes its stream
      parameters: [{name: Last-Event-ID, in: header, schema: {type: string}}]
      responses:
        "200": {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/audit:
    get:
      operationId: audit
      summary: "Admin sees everything (with filters); everyone else only entries about themselves"
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: before, in: query, schema: {type: integer}}
        - {name: action, in: query, schema: {type: string}}
        - {name: person, in: query, schema: {type: string}}
        - {name: device, in: query, schema: {type: string}}
      responses:
        "200": {description: newest first, content: {application/json: {schema: {type: object, required: [audit], properties: {audit: {type: array, items: {$ref: "#/components/schemas/AuditRow"}}}}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/parental/children:
    get:
      operationId: listChildren
      summary: "The children's devices with their status. Parents only: a person who is not a parent gets 403"
      responses:
        "200": {description: children, content: {application/json: {schema: {type: object, required: [children], properties: {children: {type: array, items: {$ref: "#/components/schemas/ChildSummary"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}:
    get:
      operationId: getChild
      summary: Detail of one child device - status, windows, exceptions, per-child domain lists, what the caller may do
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: child, content: {application/json: {schema: {$ref: "#/components/schemas/ChildDetail"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/windows:
    get:
      operationId: getChildWindows
      summary: The open windows (what opens when) with the guardrails; ETag for If-Match
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: windows
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ChildWindows"}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    put:
      operationId: putChildWindows
      summary: "Replaces the windows (household and admin; within the guardrails: rejected with the reasons, never clamped; the policy invariants are not editable). Needs If-Match. Reaches AdGuard and the replica within about a minute"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}, {name: If-Match, in: header, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], additionalProperties: false, properties: {rules: {type: array, items: {$ref: "#/components/schemas/ChildRule"}}}}}}
      responses:
        "200":
          description: saved
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ChildWindows"}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "412": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "428": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/windows/preview:
    post:
      operationId: previewChildWindows
      summary: What would be open over the next 7 days, the diff against the current windows, and every guardrail problem. Changes nothing
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], additionalProperties: false, properties: {rules: {type: array, items: {$ref: "#/components/schemas/ChildRule"}}}}}}
      responses:
        "200": {description: preview, content: {application/json: {schema: {$ref: "#/components/schemas/WindowsPreview"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/windows/undo:
    post:
      operationId: undoChildWindows
      summary: Reverts the last change of the windows as a NEW change (the guardrails apply to it too)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200":
          description: reverted
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ChildWindows"}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/exceptions:
    get:
      operationId: listChildExceptions
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: active exceptions, content: {application/json: {schema: {type: object, required: [exceptions], properties: {exceptions: {type: array, items: {$ref: "#/components/schemas/ChildException"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    post:
      operationId: grantChildException
      summary: "Opens a target for a while (youtube, roblox, maps or all = no restrictions). minutes OR until_end_of_day. Guardrails: max length, latest end, the latest end of all. Replaces an earlier exception of the same target. Expires by itself (the host job drops it, also with the service down)"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [target], additionalProperties: false, properties: {target: {type: string, enum: [youtube, roblox, maps, all]}, minutes: {type: integer, minimum: 1}, until_end_of_day: {type: boolean}}}}}
      responses:
        "201": {description: granted, content: {application/json: {schema: {$ref: "#/components/schemas/ChildException"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/exceptions/{xid}:
    delete:
      operationId: cancelChildException
      summary: Ends the exception now
      parameters: [{$ref: "#/components/parameters/Id"}, {name: xid, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "204": {description: cancelled}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/activity:
    get:
      operationId: getChildActivity
      summary: >
        The domains this device asked for, read ON DEMAND from AdGuard's own query log (7 days on the server) - nothing is stored by the gateway.
        DNS shows domains, not pages. Filters: range, blocked (1 = only blocked), q (substring). cursor pages the result.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: range, in: query, schema: {type: string, enum: [24h, 7d], default: 24h}}
        - {name: blocked, in: query, schema: {type: string, enum: ["0", "1"]}}
        - {name: q, in: query, schema: {type: string, maxLength: 80}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: activity, content: {application/json: {schema: {$ref: "#/components/schemas/Activity"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/domains:
    get:
      operationId: getChildDomains
      summary: This child's own allow-always and block-forever lists (the house-wide always-on list is not editable here)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: lists, content: {application/json: {schema: {$ref: "#/components/schemas/DomainLists"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    post:
      operationId: addChildDomain
      summary: "Adds a plain domain name to allow or deny (deny beats allow; adding to one removes it from the other). Audited and undoable"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [kind, domain], additionalProperties: false, properties: {kind: {type: string, enum: [allow, deny]}, domain: {type: string}}}}}
      responses:
        "200": {description: lists after the change, content: {application/json: {schema: {$ref: "#/components/schemas/DomainLists"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeChildDomain
      summary: Removes a domain from allow or deny (query parameters kind and domain)
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/Idem"}
        - {name: kind, in: query, required: true, schema: {type: string, enum: [allow, deny]}}
        - {name: domain, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: lists after the change, content: {application/json: {schema: {$ref: "#/components/schemas/DomainLists"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/children/{id}/domains/undo:
    post:
      operationId: undoChildDomain
      summary: Reverts the last allow/deny change of this child as a new change
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: lists after the undo, content: {application/json: {schema: {$ref: "#/components/schemas/DomainLists"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/health:
    get:
      operationId: getParentalHealth
      summary: "Is the policy really applied: the rules block in AdGuard against the one the model says it should be (hash), last apply, snapshot age, replica sync and parity, list freshness"
      responses:
        "200": {description: health, content: {application/json: {schema: {$ref: "#/components/schemas/ParentalHealth"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/filter-lists:
    get:
      operationId: listFilterLists
      summary: Admin only. AdGuard's block lists with their state, the limits and the history of changes (including automatic reverts)
      responses:
        "200": {description: lists, content: {application/json: {schema: {$ref: "#/components/schemas/FilterListsView"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    post:
      operationId: addFilterList
      summary: >
        Admin only. Adds a list from the curated catalogue or by URL. Every change: validate (URL reachable, size and rule count within the limits, hard cap needs confirm_large,
        no duplicate) -> snapshot the previous state -> apply on the origin -> probe (must-resolve names, a must-stay-blocked sentinel, the child check) -> wait for the replica and
        the parity checker -> on ANY failure revert automatically and probe again. The answer says which: applied, reverted (with the failed step) or held.
      parameters: [{$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {catalogue_id: {type: string}, url: {type: string}, name: {type: string, maxLength: 80}, confirm_large: {type: boolean}}}}}
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/FilterChangeResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/filter-lists/catalogue:
    get:
      operationId: getFilterCatalogue
      summary: Admin only. The short curated catalogue (a subset of AdGuard's own registry)
      responses:
        "200": {description: catalogue, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/CatalogueItem"}}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/parental/filter-lists/{id}:
    patch:
      operationId: patchFilterList
      summary: "Admin only. Enable/disable or rename a list; enabling and disabling go through the same validate-apply-probe-revert path"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, minProperties: 1, properties: {enabled: {type: boolean}, name: {type: string, maxLength: 80}}}}}
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/FilterChangeResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeFilterList
      summary: Admin only. Removes a list (same safety net)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/FilterChangeResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/filter-lists/{id}/refresh:
    post:
      operationId: refreshFilterList
      summary: "Admin only. Refreshes one list; a list that suddenly shrinks or grows by more than the set percentage is HELD for confirmation instead of applied (confirm=true applies it)"
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {confirm: {type: boolean}}}}}
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/FilterChangeResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /v1/parental/filter-lists/{id}/revert:
    post:
      operationId: revertFilterList
      summary: Admin only. Puts the list back to the state before its last change (the stored snapshot), through the same probe
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Idem"}]
      responses:
        "200": {description: result, content: {application/json: {schema: {$ref: "#/components/schemas/FilterChangeResult"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    deviceToken: {type: http, scheme: bearer, description: "per person AND device, shown once at enrolment, revocable"}
    session: {type: apiKey, in: cookie, name: gw_session, description: "web login; state-changing calls also need X-CSRF-Token"}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    Idem: {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 8, maxLength: 80}, description: "required by the server on switch/vacuum/exception/enrolment calls; a repeat with the same key returns the first result"}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        data_checksum: {type: string}
        ha: {type: object, properties: {link: {type: string, enum: [ws, poll, down]}, last_event_age_s: {type: [number, "null"]}}}
        schedule_service: {type: object, properties: {link: {type: string}, in_sync: {type: [boolean, "null"]}}}
        probes: {type: object, properties: {last_run_age_s: {type: [number, "null"]}}}
        audit_chain: {type: object, properties: {ok: {type: boolean}, rows: {type: integer}}}
    Session:
      type: object
      required: [person, csrf, expires_at]
      properties:
        person: {$ref: "#/components/schemas/PersonRef"}
        csrf: {type: string}
        expires_at: {type: string}
        idle_expires_at: {type: string}
    PersonRef:
      type: object
      required: [id, name, role, parent]
      properties: {id: {type: string}, name: {type: string}, role: {type: string, enum: [admin, household, readonly]}, parent: {type: boolean}}
    Person:
      type: object
      required: [id, name, role, parent, active, web_login_enabled, has_web_credentials, phones]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, household, readonly]}
        parent: {type: boolean}
        active: {type: boolean}
        web_login_enabled: {type: boolean}
        has_web_credentials: {type: boolean}
        phones: {type: integer}
    PersonCreate:
      type: object
      required: [name, role]
      additionalProperties: false
      properties: {name: {type: string, minLength: 1, maxLength: 60}, role: {type: string, enum: [admin, household, readonly]}, parent: {type: boolean}}
    EnrolmentCode:
      type: object
      required: [code, expires_at, qr_payload, ttl_s]
      properties:
        code: {type: string}
        expires_at: {type: string}
        ttl_s: {type: integer}
        qr_payload: {type: object, required: [u, c, tailnet], properties: {u: {type: string}, c: {type: string}, tailnet: {type: string, description: "reserved; filled by Task 30 with the per-device tailnet node key"}}}
        qr_svg: {type: string, description: "inline SVG of the payload"}
    EnrolRequest:
      type: object
      required: [code, device]
      additionalProperties: false
      properties:
        code: {type: string}
        device: {type: object, required: [label], properties: {label: {type: string, maxLength: 60}, model: {type: string, maxLength: 60}, platform: {type: string, maxLength: 30}, app_version: {type: string, maxLength: 30}}}
    EnrolResult:
      type: object
      required: [phone_id, token, person, expires_at]
      properties:
        phone_id: {type: string}
        token: {type: string, description: "shown once"}
        person: {$ref: "#/components/schemas/PersonRef"}
        expires_at: {type: string, description: "sliding 90 days"}
    Phone:
      type: object
      required: [id, person_id, label, created_at, last_seen, expires_at, revoked]
      properties:
        id: {type: string}
        person_id: {type: string}
        person_name: {type: string}
        label: {type: string}
        model: {type: [string, "null"]}
        platform: {type: [string, "null"]}
        created_at: {type: string}
        last_seen: {type: [string, "null"]}
        expires_at: {type: string}
        revoked: {type: boolean}
    Capabilities:
      type: object
      required: [person, tabs, modules, limits, can]
      properties:
        person: {$ref: "#/components/schemas/PersonRef"}
        tabs: {type: array, items: {type: string, enum: [home, parental]}}
        modules: {type: object, required: [parental, cameras], properties: {parental: {type: boolean}, cameras: {type: boolean}}}
        limits: {type: object, properties: {max_devices_total: {type: integer}, max_devices_per_person: {type: integer}}}
        can: {type: object, properties: {switch: {type: boolean}, edit_schedules: {type: boolean}, start_vacuum: {type: boolean}, manage_people: {type: boolean}, see_audit: {type: boolean}}}
        gateway: {type: object, properties: {version: {type: string}}}
    Device:
      type: object
      required: [id, name, kind, icon, state, state_age_s, stale, source, can_switch, can_edit_schedule, schedule_id]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [plug, lamp, dryer, uv]}
        icon: {type: string}
        state: {type: string, enum: ["on", "off", unavailable]}
        state_age_s: {type: [number, "null"]}
        stale: {type: boolean, description: "true when the HA link is down: the state is old and must not be shown as fresh"}
        source: {type: string, enum: [schedule, manual, run, unknown]}
        manual_until: {type: [string, "null"], description: "when source=manual: the next schedule edge at which the schedule takes over again"}
        next_edge: {oneOf: [{type: "null"}, {type: object, required: [at, action], properties: {at: {type: string}, action: {type: string}}}]}
        can_switch: {type: boolean}
        can_edit_schedule: {type: boolean}
        schedule_id: {type: string}
        power_w: {type: [number, "null"]}
        guardrails: {type: object}
        switch_mode: {type: string, enum: [timed, plain], description: "timed: the On button asks for a duration and a plain ON is refused (409 timed_only); OFF is always allowed"}
        run: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/DeviceRun"}]}
        run_presets: {type: array, items: {type: integer}, description: "duration presets in minutes, already limited by the max_on_minutes guardrail"}
        run_max_minutes: {type: [integer, "null"]}
        can_run: {type: boolean}
    SwitchResult:
      type: object
      required: [outcome, device_id, requested, observed, changed]
      properties:
        outcome: {type: string, enum: [confirmed, unconfirmed]}
        device_id: {type: string}
        requested: {type: string, enum: ["on", "off"]}
        observed: {type: string, enum: ["on", "off", unavailable]}
        changed: {type: boolean, description: "false when the device was already in the requested state (idempotent)"}
        waited_ms: {type: integer}
        replayed: {type: boolean}
    DeviceRun:
      type: object
      required: [id, started_at, ends_at, remaining_s, started_by, armed, minutes_total]
      properties:
        id: {type: string}
        started_at: {type: string}
        ends_at: {type: string, description: "a whole minute; Home Assistant switches the plug off there"}
        remaining_s: {type: integer}
        started_by: {type: string}
        armed: {type: boolean, description: "HA has loaded the end of this run (always true on a confirmed start)"}
        minutes_total: {type: integer, description: "counted from the real start, including extensions"}
    RunResult:
      type: object
      required: [outcome, device_id, action, run, observed]
      properties:
        outcome: {type: string, enum: [confirmed, unconfirmed]}
        device_id: {type: string}
        action: {type: string, enum: [start, extend, end]}
        run: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/DeviceRun"}]}
        observed: {type: string, enum: ["on", "off", unavailable]}
        waited_ms: {type: integer}
        replayed: {type: boolean}
    ChildIdentity:
      type: object
      required: [ip, mac, randomised_mac]
      properties:
        ip: {type: string}
        mac: {type: [string, "null"]}
        vendor: {type: [string, "null"]}
        randomised_mac: {type: boolean}
        hostname: {type: [string, "null"]}
    ChildException:
      type: object
      required: [id, target, created_at, expires_at, created_by, remaining_s]
      properties:
        id: {type: string}
        target: {type: string, enum: [youtube, roblox, maps, all]}
        created_at: {type: string}
        expires_at: {type: string}
        created_by: {type: string}
        remaining_s: {type: integer}
    ChildStatus:
      type: object
      required: [state, open_services, open_until, opens_at, exceptions, policy_ok, dns_seen]
      properties:
        state: {type: string, enum: [open, closed, restricted], description: "open = YouTube and Roblox (or everything) open now; restricted = only one of them; closed = only the always-on baseline"}
        open_services: {type: array, items: {type: string, enum: [youtube, roblox, maps, all]}}
        open_until: {type: [string, "null"], description: "when the current open stretch ends (window end or exception end)"}
        opens_at: {type: [string, "null"], description: "when it next opens (window start), if closed"}
        exceptions: {type: array, items: {$ref: "#/components/schemas/ChildException"}}
        last_query_at: {type: [string, "null"]}
        queries_today: {type: [integer, "null"]}
        blocked_today: {type: [integer, "null"]}
        policy_ok: {type: boolean, description: "the rules block in AdGuard for this device is the one the model says it should be"}
        dns_seen: {type: boolean, description: "queries of this device arrive at our resolvers (informational)"}
    ChildSummary:
      type: object
      required: [id, name, icon, device_kind, identity, status]
      properties:
        id: {type: string}
        name: {type: string}
        icon: {type: string}
        device_kind: {type: string, enum: [phone, tablet, other]}
        identity: {$ref: "#/components/schemas/ChildIdentity"}
        status: {$ref: "#/components/schemas/ChildStatus"}
    ChildGuardrails:
      type: object
      properties:
        allowed_from: {type: string}
        allowed_to: {type: string}
        max_open_minutes_per_day: {type: integer}
        max_exception_minutes: {type: integer}
        exception_latest_end: {type: string}
        all_latest_end: {type: string}
        proposed: {type: boolean, description: "true while Ivan has not confirmed these numbers"}
    ChildRule:
      type: object
      required: [id, days, start, end, opens]
      additionalProperties: false
      properties:
        id: {type: string}
        days: {type: array, items: {type: integer, minimum: 1, maximum: 7}}
        start: {type: string}
        end: {type: string, description: "HH:MM, or 24:00 for the end of the day"}
        opens: {type: array, items: {type: string, enum: [youtube, roblox, maps]}, minItems: 1}
    ChildWindows:
      type: object
      required: [child, version, tz, rules, guardrails, can_edit]
      properties:
        child: {type: string}
        version: {type: integer}
        tz: {type: string}
        updated_at: {type: string}
        rules: {type: array, items: {$ref: "#/components/schemas/ChildRule"}}
        guardrails: {$ref: "#/components/schemas/ChildGuardrails"}
        can_edit: {type: boolean}
        changed: {type: boolean}
    WindowsPreview:
      type: object
      required: [child, valid, problems]
      properties:
        child: {type: string}
        current_version: {type: integer}
        valid: {type: boolean}
        problems: {type: array, items: {type: object, required: [code, field, message], properties: {code: {type: string}, field: {type: string}, message: {type: string}}}}
        diff: {type: object}
        open_next_7_days: {type: array, items: {type: object, required: [from, to, opens], properties: {from: {type: string}, to: {type: string}, opens: {type: array, items: {type: string}}}}}
    DomainLists:
      type: object
      required: [allow, deny]
      properties:
        allow: {type: array, items: {type: string}}
        deny: {type: array, items: {type: string}}
    ChildDetail:
      type: object
      required: [id, name, icon, device_kind, identity, status, windows, exceptions, domains, can]
      properties:
        id: {type: string}
        name: {type: string}
        icon: {type: string}
        device_kind: {type: string, enum: [phone, tablet, other]}
        identity: {$ref: "#/components/schemas/ChildIdentity"}
        status: {$ref: "#/components/schemas/ChildStatus"}
        windows: {$ref: "#/components/schemas/ChildWindows"}
        exceptions: {type: array, items: {$ref: "#/components/schemas/ChildException"}}
        domains: {$ref: "#/components/schemas/DomainLists"}
        can:
          type: object
          required: [edit_windows, grant_exceptions, edit_domains, edit_guardrails, edit_filter_lists]
          properties: {edit_windows: {type: boolean}, grant_exceptions: {type: boolean}, edit_domains: {type: boolean}, edit_guardrails: {type: boolean}, edit_filter_lists: {type: boolean}}
        note: {type: string, description: "bedtime and screen-time cut-off live in the Mi WiFi app, outside this portal"}
    ActivityRow:
      type: object
      required: [name, allowed, blocked, first, last, listed_by, threat, in_allow, in_deny]
      properties:
        name: {type: string}
        allowed: {type: integer}
        blocked: {type: integer}
        first: {type: string}
        last: {type: string}
        listed_by: {type: [string, "null"], description: "the AdGuard list that already flags this name, else null (unknown to every list means nothing either way)"}
        threat: {type: boolean}
        in_allow: {type: boolean}
        in_deny: {type: boolean}
    Activity:
      type: object
      required: [child, range, rows, next_cursor, truncated, note, retention]
      properties:
        child: {type: string}
        range: {type: string}
        rows: {type: array, items: {$ref: "#/components/schemas/ActivityRow"}}
        next_cursor: {type: [string, "null"]}
        truncated: {type: boolean}
        note: {type: string, description: "DNS shows domain names, not pages"}
        retention: {type: object, required: [server, replica], properties: {server: {type: string}, replica: {type: string}}}
    ParentalHealth:
      type: object
      required: [status, policy, snapshot, replica, lists, agh]
      properties:
        status: {type: string, enum: [ok, degraded]}
        policy:
          type: object
          required: [expected_hash, applied_hash, in_sync]
          properties: {expected_hash: {type: [string, "null"]}, applied_hash: {type: [string, "null"]}, in_sync: {type: boolean}, last_apply_at: {type: [string, "null"]}, source: {type: [string, "null"]}, last_apply_ok: {type: [boolean, "null"]}}
        snapshot: {type: object, properties: {checksum: {type: [string, "null"]}, age_s: {type: [integer, "null"]}}}
        replica: {type: object, properties: {sync_status: {type: [string, "null"]}, sync_age_s: {type: [integer, "null"]}, parity: {type: string, enum: [ok, mismatch, unknown]}}}
        lists: {type: object, properties: {count: {type: integer}, oldest_updated: {type: [string, "null"]}, stale: {type: boolean}}}
        agh: {type: object, properties: {reachable: {type: boolean}}}
    FilterList:
      type: object
      required: [id, name, url, enabled, rules_count]
      properties:
        id: {type: integer}
        name: {type: string}
        url: {type: string}
        enabled: {type: boolean}
        rules_count: {type: integer}
        last_updated: {type: [string, "null"]}
    CatalogueItem:
      type: object
      required: [catalogue_id, name, url]
      properties: {catalogue_id: {type: string}, name: {type: string}, description: {type: string}, url: {type: string}}
    FilterStep:
      type: object
      required: [name, ok]
      properties: {name: {type: string}, ok: {type: boolean}, detail: {type: string}}
    FilterListChange:
      type: object
      required: [id, at, by, action, result, steps]
      properties:
        id: {type: string}
        at: {type: string}
        by: {type: string}
        action: {type: string, enum: [add, remove, enable, disable, rename, refresh, revert]}
        list_id: {type: [integer, "null"]}
        list_name: {type: [string, "null"]}
        result: {type: string, enum: [applied, reverted, held, failed]}
        steps: {type: array, items: {$ref: "#/components/schemas/FilterStep"}}
        reason: {type: [string, "null"]}
    FilterListsView:
      type: object
      required: [lists, limits, history]
      properties:
        lists: {type: array, items: {$ref: "#/components/schemas/FilterList"}}
        limits: {type: object, properties: {max_rules: {type: integer}, hard_cap_rules: {type: integer}, change_percent: {type: integer}}}
        history: {type: array, items: {$ref: "#/components/schemas/FilterListChange"}}
    FilterChangeResult:
      type: object
      required: [result, change]
      properties:
        result: {type: string, enum: [applied, reverted, held]}
        change: {$ref: "#/components/schemas/FilterListChange"}
        list: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/FilterList"}]}
        hold_reason: {type: [string, "null"]}
        replayed: {type: boolean}
    Vacuum:
      type: object
      required: [id, name, state, available, scenarios, stale]
      properties:
        id: {type: string}
        name: {type: string}
        icon: {type: string}
        state: {type: string}
        battery: {type: [integer, "null"]}
        available: {type: boolean}
        stale: {type: boolean}
        running_scenario: {type: [string, "null"]}
        last_result: {type: [string, "null"]}
        scenarios: {type: array, items: {type: object, required: [id, name, description], properties: {id: {type: string}, name: {type: string}, description: {type: string}}}}
        schedule_id: {type: [string, "null"]}
        can_start: {type: boolean}
    VacuumResult:
      type: object
      required: [outcome, vacuum_id, action, observed]
      properties:
        outcome: {type: string, enum: [confirmed, unconfirmed]}
        vacuum_id: {type: string}
        action: {type: string, enum: [start, pause, resume, dock]}
        scenario: {type: [string, "null"]}
        observed: {type: object}
        waited_ms: {type: integer}
        replayed: {type: boolean}
    ScheduleDoc:
      type: object
      required: [entity, version, rules]
      properties:
        entity: {type: string}
        version: {type: integer}
        tz: {type: string}
        rules: {type: array, items: {type: object}}
        guardrails: {type: object}
        can_edit: {type: boolean}
    ServiceTile:
      type: object
      required: [id, name, icon, url, badge, visible_to]
      properties:
        id: {type: string}
        name: {type: string}
        icon: {type: string}
        url: {type: string}
        badge: {type: string, enum: [ok, degraded, down, unknown]}
        visible_to: {type: string, enum: [admin, household]}
        last_ok: {type: [string, "null"]}
        rtt_ms: {type: [integer, "null"]}
        detail: {type: [string, "null"]}
    AuditRow:
      type: object
      required: [seq, ts, action, person, device, ok]
      properties:
        seq: {type: integer}
        ts: {type: string}
        action: {type: string}
        person: {type: [string, "null"]}
        device: {type: [string, "null"]}
        target: {type: [string, "null"]}
        before: {}
        after: {}
        ok: {type: boolean}
        source_ip: {type: [string, "null"]}
