name: ETA Tiger robot vacuum
# Built from documentation 2026-10-24; first live DP dump 2026-11-03; start/pause/resume/return verified on the robot the same day (comments in the vacuum entity). Locate (DP 11) and fan speed writes are NOT verified.
# Sources: localtuya issue #1964 (DP names), Tuya's common sweeping-robot instruction set (enum values marked "guess").
# Every line marked "VERIFY" is settled by the Phase 2/3 capture on the real robot; unknown status strings must be added to the
# status mapping BEFORE the entity is trusted (tuya_local shows an unmapped status as "cleaning").
# Master copy lives in git (docs/robots/tuya-local/); the installed copy goes to
# /srv/apps/homeassistant/custom_components/tuya_local/devices/ and must be re-copied after any upgrade of tuya_local.
products:
  - id: ex7zonfgdg0hoht2   # confirmed 2026-11-03 from the robot's own LAN broadcast
    manufacturer: ETA
    model: Tiger 4242 90000
entities:
  - entity: vacuum
    dps:
      # Verified on the robot 2026-11-03 (see docs/robots/STATE.md):
      #  - DP 1 true  = start / resume (the robot sets its own mode to "smart"); DP 1 false = pause in place (the robot itself flips DP 2 to true).
      #    So DP 1 is the vacuum's "activate": start and resume = true, pause = false.
      #  - DP 3 true  = return to the dock; it works while cleaning and while paused. The mode DP 4 "chargego" (what the stock return_to_base would write)
      #    was IGNORED while the robot was cleaning, so return_to_base is taken from DP 3 instead.
      #  - DP 2 (pause) is therefore not mapped: the robot keeps it in step with DP 1.
      - id: 1
        type: boolean
        name: activate
      - id: 3
        type: boolean
        name: command
        mapping:
          - dps_val: true
            value: return_to_base
      - id: 5
        type: string
        name: status
        mapping:                # guess: Tuya sweeper "status" enum. Seen on the robot 2026-11-03: charging, standby (docked-awake and paused), cleaning, returning
          - dps_val: standby
            value: standby
          - dps_val: smart
            value: cleaning
          - dps_val: zone_clean
            value: cleaning
          - dps_val: part_clean
            value: cleaning
          - dps_val: cleaning
            value: cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: cleaning
          - dps_val: pos_arrived
            value: cleaning
          - dps_val: pos_unarrive
            value: cleaning
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: charged
          - dps_val: sleep
            value: sleep
      - id: 9
        type: string
        name: fan_speed
        mapping:
          - dps_val: gentle
            value: low
          - dps_val: normal
            value: medium
          - dps_val: strong
            value: high
      - id: 11
        type: boolean
        name: locate            # VERIFY: the localtuya report says this DP "returns -1"
        optional: true
      - id: 28
        type: bitfield
        name: error
        hidden: true

  - entity: button
    name: Return to dock (DP 3)
    icon: "mdi:home-import-outline"
    dps:
      - id: 3
        type: boolean
        name: button          # VERIFY: the only route the localtuya author found for "recharge"; keep or hide after the Phase 3 session

  - entity: sensor
    class: battery
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
        class: measurement

  - entity: sensor
    name: Cleaning time
    category: diagnostic
    class: duration
    dps:
      - id: 6
        type: integer
        name: sensor
        unit: min               # confirmed 2026-11-03: 0..12 over a 12-minute run

  - entity: sensor
    name: Cleaning area
    category: diagnostic
    class: area
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: "m²"              # VERIFY unit

  - entity: sensor
    name: Total cleaning area
    category: diagnostic
    dps:
      - id: 29
        type: integer
        name: sensor
        optional: true

  - entity: sensor
    name: Total cleaning count
    category: diagnostic
    dps:
      - id: 30
        type: integer
        name: sensor
        optional: true

  - entity: sensor
    name: Total cleaning time
    category: diagnostic
    dps:
      - id: 31
        type: integer
        name: sensor
        optional: true

  - entity: sensor
    name: Edge brush life
    category: diagnostic
    dps:
      - id: 17
        type: integer
        name: sensor
        unit: min               # raw 6000 / 12000 / 9000 on a fresh-looking robot: minutes of life left (100 h / 200 h / 150 h), VERIFY after a cleaning
        optional: true

  - entity: sensor
    name: Roller brush life
    category: diagnostic
    dps:
      - id: 19
        type: integer
        name: sensor
        unit: min               # raw 6000 / 12000 / 9000 on a fresh-looking robot: minutes of life left (100 h / 200 h / 150 h), VERIFY after a cleaning
        optional: true

  - entity: sensor
    translation_key: filter_life
    category: diagnostic
    dps:
      - id: 21
        type: integer
        name: sensor
        unit: min               # raw 6000 / 12000 / 9000 on a fresh-looking robot: minutes of life left (100 h / 200 h / 150 h), VERIFY after a cleaning
        optional: true

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 28
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 28
        type: bitfield
        name: fault_code

  # Discovery (2026-11-03): raw values of the suction and water-quantity DPs, to learn the level names the robot uses.
  # Replace by proper select entities once the values are known.
  - entity: sensor
    name: Suction raw (DP 9)
    category: diagnostic
    dps:
      - id: 9
        type: string
        name: sensor
  - entity: sensor
    name: Water raw (DP 10)
    category: diagnostic
    dps:
      - id: 10
        type: string
        name: sensor

  # Water quantity (mop). Raw values seen on the robot 2026-11-03 while Ivan went through the app's levels: closed, low, middle, high.
  # Writes are verified once this entity has been tested (see docs/robots/STATE.md).
  - entity: select
    name: Water quantity
    icon: "mdi:water"
    dps:
      - id: 10
        type: string
        name: option
        mapping:
          - dps_val: closed
            value: "Off"
          - dps_val: low
            value: Low
          - dps_val: middle
            value: Medium
          - dps_val: high
            value: High
