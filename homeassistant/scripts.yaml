# Hand-written reconcile entry point. Since Task 27 (2026-10-19) the per-plug reconcile scripts are GENERATED (script.sch_reconcile_*, see
# portal/schedules/README.md); this file keeps only the composition called at HA start. Vacuum plan scripts below are plan CONTENT, not schedules.

reconcile_all_plugs:
  alias: 'Reconcile all scheduled plugs to current schedule'
  sequence:
    - service: script.sch_reconcile_all

# ── Robot vacuum H40 Livingroom: plan "vacuum, then mop" per room, dust emptied after the vacuum phases ──
# Manual start only. Ivan's plan (2026-10-16):
#   Koridor: vacuum (Turbo) -> dust -> mop (medium water);  Bathroom: vacuum -> dust -> mop;
#   Living room: vacuum -> dust;  Kitchen: vacuum -> dust -> mop -> dust.
# "Turbo" = mode Full Speed, "medium water" = Level2 (confirmed in the Mi Home mode screen, 2026-10-16: suction Silent/Standard/Strong/Turbo = Silent/Basic/Strong/Full Speed, water Level 1-3, path and times are left as set).
# After every phase the robot returns to the dock by itself; "dust" = wait for the station to empty the bin
# (status stationworking, ~11 s) and press Start Dust Arrest if it does not start by itself.
# The room ids are literal strings in params (a templated "[10]" is turned into a list by HA and the robot ignores it).
# Before each phase the cleaning type is set and checked, and after the start the cleaning type the robot reports
# is checked (not its status: the H40 says "sweeping" in mop mode too - found in the first run, 2026-10-16):
# if it differs from the plan the robot is sent home and the script stops.
# Found in the first full run (2026-10-16): after a vacuum phase the station empties the bin by itself ~10 s after
# docking (sometimes the robot goes straight from "go charging" to "stationworking"); after a mop phase it does not.
# Resume after an abort: run with skip_phases = number of finished phases (Developer tools > Actions:
#   action: script.vacuum_livingroom_plan / data: {skip_phases: 1}).
# Aborting: stop the script (Settings > Scripts). A robot sent home by hand counts as "phase done".
vacuum_livingroom_plan:
  alias: 'Vacuum Livingroom: vacuum + mop plan, dust emptied after vacuum phases'
  mode: single
  max_exceeded: silent
  fields:
    skip_phases:
      description: 'How many first phases to skip (0 = the whole plan; 1 = start with the Koridor mop). Phases: 1 Koridor vacuum, 2 Koridor mop, 3 Bathroom vacuum, 4 Bathroom mop, 5 Living room vacuum, 6 Kitchen vacuum, 7 Kitchen mop.'
      default: 0
      selector:
        number:
          min: 0
          max: 6
          mode: box
  variables:
    st: sensor.xiaomi_ov51gl_b5f6_status
    bat: sensor.xiaomi_ov51gl_b5f6_battery_level
    vac: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
    area: sensor.xiaomi_ov51gl_b5f6_cleaning_area
    ctime: sensor.xiaomi_ov51gl_b5f6_cleaning_time
    skip_n: "{{ skip_phases | default(0) | int(0) }}"
    phases:
      - {room: 10, kind: vacuum, dust: true}
      - {room: 10, kind: mop, dust: false}
      - {room: 9, kind: vacuum, dust: true}
      - {room: 9, kind: mop, dust: false}
      - {room: 13, kind: vacuum, dust: true}
      - {room: 8, kind: vacuum, dust: true}
      - {room: 8, kind: mop, dust: true}
  sequence:
    - if: "{{ states(st) not in ['charging', 'charged'] }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_livingroom
            title: 'Пылесос (гостиная): не запущено'
            message: "Пылесос должен стоять на базе, сейчас статус {{ states(st) }}."
        - stop: 'vacuum is not docked'
          error: true
    - repeat:
        for_each: "{{ phases[skip_n:] }}"
        sequence:
          - variables:
              kind: "{{ repeat.item.kind }}"
              room_name: "{{ {8: 'Кухня', 9: 'Ванная', 10: 'Коридор', 13: 'Гостиная'}[repeat.item.room] }}"
              phase: "{{ room_name }}, {{ 'уборка' if repeat.item.kind == 'vacuum' else 'протирка' }}"
              want_type: "{{ 'Sweep' if repeat.item.kind == 'vacuum' else 'Mop' }}"
              want_code: "{{ 1 if repeat.item.kind == 'vacuum' else 2 }}"
          # enough battery for a phase
          - if: "{{ states(bat) | float(0) < 50 }}"
            then:
              - wait_template: "{{ states(bat) | float(0) >= 50 }}"
                timeout: '01:30:00'
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: vacuum_livingroom
                      title: 'Пылесос (гостиная): остановлено'
                      message: "{{ phase }}: заряд {{ states(bat) }}% за 90 минут не дошёл до 50%."
                  - stop: 'battery did not reach 50 %'
                    error: true
          # cleaning type, suction (vacuum phases) or water level (mop phases), then check they were applied
          - action: select.select_option
            target:
              entity_id: select.xiaomi_ov51gl_b5f6_sweep_mop_type
            data:
              option: "{{ want_type }}"
          - if: "{{ kind == 'vacuum' }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.xiaomi_ov51gl_b5f6_mode
                data:
                  option: 'Full Speed'
            else:
              - action: select.select_option
                target:
                  entity_id: select.xiaomi_ov51gl_b5f6_mop_water_output_level
                data:
                  option: 'Level2'
          - wait_template: >-
              {{ is_state('select.xiaomi_ov51gl_b5f6_sweep_mop_type', want_type)
                 and (is_state('select.xiaomi_ov51gl_b5f6_mode', 'Full Speed') if kind == 'vacuum'
                      else is_state('select.xiaomi_ov51gl_b5f6_mop_water_output_level', 'Level2')) }}
            timeout: '00:00:30'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_livingroom
                  title: 'Пылесос (гостиная): остановлено'
                  message: "{{ phase }}: режим не применился (тип {{ states('select.xiaomi_ov51gl_b5f6_sweep_mop_type') }}, всасывание {{ states('select.xiaomi_ov51gl_b5f6_mode') }}, вода {{ states('select.xiaomi_ov51gl_b5f6_mop_water_output_level') }})."
              - stop: 'cleaning settings were not applied'
                error: true
          # start exactly this room
          - choose:
              - conditions: "{{ repeat.item.room == 10 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[10]"]
              - conditions: "{{ repeat.item.room == 9 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[9]"]
              - conditions: "{{ repeat.item.room == 13 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[13]"]
              - conditions: "{{ repeat.item.room == 8 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[8]"]
          - wait_template: "{{ states(st) in ['sweeping', 'mopping', 'sweeping and mopping'] }}"
            timeout: '00:03:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_livingroom
                  title: 'Пылесос (гостиная): остановлено'
                  message: "{{ phase }}: команда не принята, статус {{ states(st) }}."
              - stop: 'room start was not accepted'
                error: true
          # the robot reports status "sweeping" in mop mode too: check the cleaning type it reports (1 Sweep, 2 Mop);
          # that attribute refreshes with the state change, the long timeout only covers a slow poll
          - wait_template: "{{ state_attr(vac, 'vacuum.sweep_mop_type') | int(0) == want_code }}"
            timeout: '00:02:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: vacuum.return_to_base
                target:
                  entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_livingroom
                  title: 'Пылесос (гостиная): остановлено'
                  message: "{{ phase }}: ожидался тип уборки {{ want_type }}, пылесос сообщает {{ state_attr(vac, 'vacuum.sweep_mop_type') }}. Отправлен на базу."
              - stop: 'robot runs in the wrong mode'
                error: true
          # until it is back on the dock (a manual pause or a stuck robot just waits; ha-alerts reports it)
          - wait_template: "{{ states(st) in ['charging', 'charged', 'stationworking'] or states(vac) == 'error' }}"
            timeout: '01:30:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed or states(vac) == 'error' }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_livingroom
                  title: 'Пылесос (гостиная): остановлено'
                  message: "{{ phase }}: не вернулся на базу (статус {{ states(st) }}, состояние {{ states(vac) }})."
              - stop: 'robot did not return to the dock'
                error: true
          - variables:
              area_raw: "{{ states(area) }}"
              time_raw: "{{ states(ctime) }}"
          # dust emptying (vacuum phases and the last mop): the station usually starts ~10 s after docking
          - if: "{{ repeat.item.dust }}"
            then:
              - if: "{{ states(st) != 'stationworking' }}"
                then:
                  - wait_template: "{{ states(st) == 'stationworking' }}"
                    timeout: '00:01:30'
                    continue_on_timeout: true
                  - if: "{{ not wait.completed }}"
                    then:
                      - action: button.press
                        target:
                          entity_id: button.xiaomi_ov51gl_b5f6_start_dust_arrest
                      - wait_template: "{{ states(st) == 'stationworking' }}"
                        timeout: '00:02:00'
                        continue_on_timeout: true
                      - if: "{{ not wait.completed }}"
                        then:
                          - action: persistent_notification.create
                            data:
                              notification_id: vacuum_livingroom
                              title: 'Пылесос (гостиная): остановлено'
                              message: "{{ phase }}: станция не начала опорожнение даже по команде."
                          - stop: 'station did not empty the bin'
                            error: true
              - wait_template: "{{ states(st) in ['charging', 'charged'] }}"
                timeout: '00:03:00'
                continue_on_timeout: true
          - action: logbook.log
            data:
              name: 'Vacuum Livingroom'
              message: "{{ phase }} (id {{ repeat.item.room }}): готово{{ ', мусор сброшен' if repeat.item.dust else '' }}. Счётчик площади {{ area_raw }}, время {{ time_raw }} с."
          - delay: '00:00:10'
    - action: logbook.log
      data:
        name: 'Vacuum Livingroom'
        message: 'ПЛАН ВЫПОЛНЕН'
    - action: persistent_notification.create
      data:
        notification_id: vacuum_livingroom
        title: 'Пылесос (гостиная): план выполнен'
        message: 'Коридор, ванная, гостиная и кухня: уборка и протирка по плану, мусор сбрасывался после уборки.'


# ── Robot vacuum H40 Bedroom (e160): two plans, started by the schedule at 09:00 / 19:00 or by hand ──
# morning 09:00: Bedroom (room 3) vacuum on Silent, nothing else.
# evening 19:00: Bedroom vacuum on Turbo (Full Speed) -> dust emptied -> Bedroom mop on Level3 (maximum water).
# Same engine as vacuum_livingroom_plan (see its comments): cleaning type and level are set and checked before each
# phase, the type the robot reports is checked after the start, the station empties the bin after vacuum phases
# (button pressed only if it did not start by itself), every wait has a timeout, any failure stops the script
# with an HA notification and ha-alerts reports a plan that did not finish.
# Start by hand: action script.vacuum_bedroom_plan, data {plan: evening}  (optionally skip_phases: 1).
# Room ids come from room_information (2026-10-16): 3 Bedroom, 5 Child's room, 6 Child's room 1, 7 Corridor.
vacuum_bedroom_plan:
  alias: 'Vacuum Bedroom: morning (Silent) / evening (Turbo + mop Level3) plan'
  mode: single
  max_exceeded: silent
  fields:
    plan:
      description: 'morning = Silent vacuum 09:00; evening = Turbo vacuum, then mop on Level3, 19:00'
      default: morning
      selector:
        select:
          options:
            - morning
            - evening
    skip_phases:
      description: 'How many first phases to skip (0 = the whole plan)'
      default: 0
      selector:
        number:
          min: 0
          max: 2
          mode: box
  variables:
    st: sensor.xiaomi_ov51gl_e160_status
    bat: sensor.xiaomi_ov51gl_e160_battery_level
    vac: vacuum.xiaomi_ov51gl_e160_robot_cleaner
    area: sensor.xiaomi_ov51gl_e160_cleaning_area
    ctime: sensor.xiaomi_ov51gl_e160_cleaning_time
    plan_name: "{{ plan | default('morning') }}"
    skip_n: "{{ skip_phases | default(0) | int(0) }}"
    plans:
      morning:
        - {room: 3, kind: vacuum, suction: 'Silent', water: '', dust: true}
      evening:
        - {room: 3, kind: vacuum, suction: 'Full Speed', water: '', dust: true}
        - {room: 3, kind: mop, suction: '', water: 'Level3', dust: false}
    phases: "{{ plans[plan_name] }}"
  sequence:
    - if: "{{ states(st) not in ['charging', 'charged'] }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_bedroom
            title: 'Пылесос (спальня): не запущено'
            message: "Пылесос должен стоять на базе, сейчас статус {{ states(st) }}."
        - stop: 'vacuum is not docked'
          error: true
    - repeat:
        for_each: "{{ phases[skip_n:] }}"
        sequence:
          - variables:
              kind: "{{ repeat.item.kind }}"
              room_name: "{{ {3: 'Спальня'}[repeat.item.room] }}"
              phase: "{{ room_name }}, {{ 'уборка' if repeat.item.kind == 'vacuum' else 'протирка' }} ({{ plan_name }})"
              want_type: "{{ 'Sweep' if repeat.item.kind == 'vacuum' else 'Mop' }}"
              want_code: "{{ 1 if repeat.item.kind == 'vacuum' else 2 }}"
          - if: "{{ states(bat) | float(0) < 50 }}"
            then:
              - wait_template: "{{ states(bat) | float(0) >= 50 }}"
                timeout: '01:30:00'
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: vacuum_bedroom
                      title: 'Пылесос (спальня): остановлено'
                      message: "{{ phase }}: заряд {{ states(bat) }}% за 90 минут не дошёл до 50%."
                  - stop: 'battery did not reach 50 %'
                    error: true
          - action: select.select_option
            target:
              entity_id: select.xiaomi_ov51gl_e160_sweep_mop_type
            data:
              option: "{{ want_type }}"
          - if: "{{ kind == 'vacuum' }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.xiaomi_ov51gl_e160_mode
                data:
                  option: "{{ repeat.item.suction }}"
            else:
              - action: select.select_option
                target:
                  entity_id: select.xiaomi_ov51gl_e160_mop_water_output_level
                data:
                  option: "{{ repeat.item.water }}"
          - wait_template: >-
              {{ is_state('select.xiaomi_ov51gl_e160_sweep_mop_type', want_type)
                 and (is_state('select.xiaomi_ov51gl_e160_mode', repeat.item.suction) if kind == 'vacuum'
                      else is_state('select.xiaomi_ov51gl_e160_mop_water_output_level', repeat.item.water)) }}
            timeout: '00:00:30'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_bedroom
                  title: 'Пылесос (спальня): остановлено'
                  message: "{{ phase }}: режим не применился (тип {{ states('select.xiaomi_ov51gl_e160_sweep_mop_type') }}, всасывание {{ states('select.xiaomi_ov51gl_e160_mode') }}, вода {{ states('select.xiaomi_ov51gl_e160_mop_water_output_level') }})."
              - stop: 'cleaning settings were not applied'
                error: true
          - action: xiaomi_miot.call_action
            data:
              entity_id: vacuum.xiaomi_ov51gl_e160_robot_cleaner
              siid: 2
              aiid: 16
              params: ["[3]"]
          - wait_template: "{{ states(st) in ['sweeping', 'mopping', 'sweeping and mopping'] }}"
            timeout: '00:03:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_bedroom
                  title: 'Пылесос (спальня): остановлено'
                  message: "{{ phase }}: команда не принята, статус {{ states(st) }}."
              - stop: 'room start was not accepted'
                error: true
          - wait_template: "{{ state_attr(vac, 'vacuum.sweep_mop_type') | int(0) == want_code }}"
            timeout: '00:02:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: vacuum.return_to_base
                target:
                  entity_id: vacuum.xiaomi_ov51gl_e160_robot_cleaner
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_bedroom
                  title: 'Пылесос (спальня): остановлено'
                  message: "{{ phase }}: ожидался тип уборки {{ want_type }}, пылесос сообщает {{ state_attr(vac, 'vacuum.sweep_mop_type') }}. Отправлен на базу."
              - stop: 'robot runs in the wrong mode'
                error: true
          - wait_template: "{{ states(st) in ['charging', 'charged', 'stationworking'] or states(vac) == 'error' }}"
            timeout: '01:30:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed or states(vac) == 'error' }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_bedroom
                  title: 'Пылесос (спальня): остановлено'
                  message: "{{ phase }}: не вернулся на базу (статус {{ states(st) }}, состояние {{ states(vac) }})."
              - stop: 'robot did not return to the dock'
                error: true
          - variables:
              area_raw: "{{ states(area) }}"
              time_raw: "{{ states(ctime) }}"
          - if: "{{ repeat.item.dust }}"
            then:
              - if: "{{ states(st) != 'stationworking' }}"
                then:
                  - wait_template: "{{ states(st) == 'stationworking' }}"
                    timeout: '00:01:30'
                    continue_on_timeout: true
                  - if: "{{ not wait.completed }}"
                    then:
                      - action: button.press
                        target:
                          entity_id: button.xiaomi_ov51gl_e160_start_dust_arrest
                      - wait_template: "{{ states(st) == 'stationworking' }}"
                        timeout: '00:02:00'
                        continue_on_timeout: true
                      - if: "{{ not wait.completed }}"
                        then:
                          - action: persistent_notification.create
                            data:
                              notification_id: vacuum_bedroom
                              title: 'Пылесос (спальня): остановлено'
                              message: "{{ phase }}: станция не начала опорожнение даже по команде."
                          - stop: 'station did not empty the bin'
                            error: true
              - wait_template: "{{ states(st) in ['charging', 'charged'] }}"
                timeout: '00:03:00'
                continue_on_timeout: true
          - action: logbook.log
            data:
              name: 'Vacuum Bedroom'
              message: "{{ phase }} (id {{ repeat.item.room }}): готово{{ ', мусор сброшен' if repeat.item.dust else '' }}. Счётчик площади {{ area_raw }}, время {{ time_raw }} с."
          - delay: '00:00:10'
    - action: logbook.log
      data:
        name: 'Vacuum Bedroom'
        message: 'ПЛАН ВЫПОЛНЕН'
    - action: persistent_notification.create
      data:
        notification_id: vacuum_bedroom
        title: 'Пылесос (спальня): план выполнен'
        message: "План {{ plan_name }} выполнен."


# ── ETA Tiger (added 2026-11-03, Task 32 follow-up) ───────────────────────────────────────────────────────────────────────────
# One whole-flat cleaning (the robot has its own map and routing; no room selection from HA). The plan only chooses the suction level; the water on the
# mop is always the minimum (Low) - Ivan, 2026-11-03. Start = DP 1 true, which the robot treats as "start/resume"; the robot comes back to the dock by itself.
# Verified on the robot (see docs/robots/STATE.md): suction gentle/normal/strong = low/medium/high, water closed/low/middle/high = Off/Low/Medium/High.
# Start by hand: action script.vacuum_tiger_plan, data {plan: quiet}   (quiet | standard | strong).
vacuum_tiger_plan:
  alias: 'Vacuum Tiger: quiet / standard / strong cleaning, water Low'
  mode: single
  max_exceeded: silent
  fields:
    plan:
      description: 'quiet = low suction (the evening 20:00 plan); standard = medium; strong = high. Water on the mop is always Low.'
      default: quiet
      selector:
        select:
          options:
            - quiet
            - standard
            - strong
  variables:
    vac: vacuum.eta_tiger
    bat: sensor.eta_tiger_battery
    water: select.hall_eta_tiger_water_quantity
    plan_name: "{{ plan | default('quiet') }}"
    fans: {quiet: low, standard: medium, strong: high}
    fan: "{{ fans[plan_name] | default('low') }}"
  sequence:
    - if: "{{ states(vac) != 'docked' }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_tiger
            title: 'Пылесос (Tiger): не запущено'
            message: "Пылесос должен стоять на базе, сейчас состояние {{ states(vac) }}."
        - stop: 'vacuum is not docked'
          error: true
    - if: "{{ states(bat) | float(0) < 40 }}"
      then:
        - wait_template: "{{ states(bat) | float(0) >= 40 }}"
          timeout: '02:00:00'
          continue_on_timeout: true
        - if: "{{ not wait.completed }}"
          then:
            - action: persistent_notification.create
              data:
                notification_id: vacuum_tiger
                title: 'Пылесос (Tiger): остановлено'
                message: "Заряд {{ states(bat) }}% за 2 часа не дошёл до 40%."
            - stop: 'battery did not reach 40 %'
              error: true
    - action: vacuum.set_fan_speed
      target:
        entity_id: vacuum.eta_tiger
      data:
        fan_speed: "{{ fan }}"
    - action: select.select_option
      target:
        entity_id: select.hall_eta_tiger_water_quantity
      data:
        option: 'Low'
    - wait_template: "{{ state_attr(vac, 'fan_speed') == fan and is_state(water, 'Low') }}"
      timeout: '00:00:30'
      continue_on_timeout: true
    - if: "{{ not wait.completed }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_tiger
            title: 'Пылесос (Tiger): остановлено'
            message: "Режим не применился (всасывание {{ state_attr(vac, 'fan_speed') }}, вода {{ states(water) }}), ожидалось {{ fan }} и Low."
        - stop: 'cleaning settings were not applied'
          error: true
    - action: vacuum.start
      target:
        entity_id: vacuum.eta_tiger
    - wait_template: "{{ states(vac) == 'cleaning' }}"
      timeout: '00:02:00'
      continue_on_timeout: true
    - if: "{{ not wait.completed }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_tiger
            title: 'Пылесос (Tiger): остановлено'
            message: "Команда старта не принята, состояние {{ states(vac) }}."
        - stop: 'start was not accepted'
          error: true
    - wait_template: "{{ states(vac) in ['docked', 'error'] }}"
      timeout: '03:00:00'
      continue_on_timeout: true
    - if: "{{ not wait.completed or states(vac) == 'error' }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_tiger
            title: 'Пылесос (Tiger): остановлено'
            message: "Не вернулся на базу (состояние {{ states(vac) }}, заряд {{ states(bat) }}%)."
        - stop: 'robot did not return to the dock'
          error: true
    - action: logbook.log
      data:
        name: 'Vacuum Tiger'
        message: "Уборка ({{ plan_name }}, всасывание {{ fan }}, вода Low) готова. Время {{ states('sensor.eta_tiger_cleaning_time') }} мин, площадь {{ states('sensor.eta_tiger_cleaning_area') }}."
    - action: logbook.log
      data:
        name: 'Vacuum Tiger'
        message: 'ПЛАН ВЫПОЛНЕН'
    - action: persistent_notification.create
      data:
        notification_id: vacuum_tiger
        title: 'Пылесос (Tiger): план выполнен'
        message: "План {{ plan_name }} выполнен."


# ── Xiaomi Robo Mop X20+ (added 2026-11-03; rebuilt the same day as room-by-room) ────────────────────────────────────────────────
# Same idea as vacuum_livingroom_plan (H40): rooms one after another, after each room the robot is back on the base and the bin is emptied; the mop is washed and the
# station dries it at the END. Rooms (Mi Home map ids, found on the robot 2026-11-03: 1 Koridor, 3 Living Room confirmed by watching the robot; 2 Bathroom, 4 Kitchen by order):
#   1 Коридор (vacuum + mop), 2 Ванная (vacuum + mop), 3 Гостиная (vacuum only), 4 Кухня (vacuum + mop).
# HOW A ROOM IS STARTED (recipe for xiaomi.vacuum.c102gl, verified on the robot): action 4.1 with piid 1 = 18 and piid 10 = {"selects":[[room,1,1,2,1]]}; the robot then uses the
# room's SAVED settings (Mi Home -> Custom mode: Turbo suction, mop Level 3, living room vacuum only). HA does not rewrite them; it READS BACK the suction / water level the robot
# applied (props 2:3 and 4:5 are overwritten with the room's settings at the start) and stops the room when they differ from what is expected (Turbo; Level 3 for mop rooms).
# The payload is a literal string per room (a templated JSON string would be turned into a dict by HA: see the H40 notes).
# The end of a room = the robot sits "charging" for a minute, or the station started drying (end of a mop job); "dustcollecting" seen before that = the station emptied the bin
# by itself (Mi Home station setting "every visit"); if it did not, the dust button is pressed.
# Start by hand: action script.vacuum_x20_plan, data {skip_rooms: 2, max_rooms: 1} runs only the living room.
vacuum_x20_plan:
  alias: 'Vacuum X20+: room by room (Koridor, Bathroom, Living Room, Kitchen), dust after each, mop wash + dry at the end'
  mode: single
  max_exceeded: silent
  fields:
    skip_rooms:
      description: 'How many first rooms to skip (0 = the whole plan)'
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    max_rooms:
      description: 'How many rooms to clean after the skipped ones (4 = all that remain)'
      default: 4
      selector:
        number:
          min: 1
          max: 4
          mode: box
  variables:
    st: sensor.xiaomi_c102gl_cadb_status
    bat: sensor.xiaomi_c102gl_cadb_battery_level
    vac: vacuum.xiaomi_c102gl_cadb_robot_cleaner
    rooms:
      - {id: 1, name: 'Коридор', mop: true}
      - {id: 2, name: 'Ванная', mop: true}
      - {id: 3, name: 'Гостиная', mop: false}
      - {id: 4, name: 'Кухня', mop: true}
    skip_n: "{{ skip_rooms | default(0) | int(0) }}"
    max_n: "{{ max_rooms | default(4) | int(4) }}"
    todo: "{{ rooms[skip_n:skip_n + max_n] }}"
  sequence:
    - if: "{{ states(vac) != 'docked' }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_x20
            title: 'Пылесос X20+: не запущено'
            message: "Пылесос должен стоять на базе, сейчас состояние {{ states(vac) }}."
        - stop: 'vacuum is not docked'
          error: true
    - repeat:
        for_each: "{{ todo }}"
        sequence:
          - variables:
              rid: "{{ repeat.item.id }}"
              mop: "{{ repeat.item.mop }}"
              phase: "{{ repeat.item.name }} ({{ 'пылесос + мойка' if repeat.item.mop else 'только пылесос' }})"
          - if: "{{ states(bat) | float(0) < 50 }}"
            then:
              - wait_template: "{{ states(bat) | float(0) >= 50 }}"
                timeout: '01:30:00'
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: vacuum_x20
                      title: 'Пылесос X20+: остановлено'
                      message: "{{ phase }}: заряд {{ states(bat) }}% за 90 минут не дошёл до 50%."
                  - stop: 'battery did not reach 50 %'
                    error: true
          - choose:
              - conditions: "{{ rid == 1 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                      siid: 4
                      aiid: 1
                      force_params: true
                      params:
                        - piid: 1
                          value: 18
                        - piid: 10
                          value: '{"selects":[[1,1,1,2,1]]}'
              - conditions: "{{ rid == 2 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                      siid: 4
                      aiid: 1
                      force_params: true
                      params:
                        - piid: 1
                          value: 18
                        - piid: 10
                          value: '{"selects":[[2,1,1,2,1]]}'
              - conditions: "{{ rid == 3 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                      siid: 4
                      aiid: 1
                      force_params: true
                      params:
                        - piid: 1
                          value: 18
                        - piid: 10
                          value: '{"selects":[[3,1,1,2,1]]}'
              - conditions: "{{ rid == 4 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                      siid: 4
                      aiid: 1
                      force_params: true
                      params:
                        - piid: 1
                          value: 18
                        - piid: 10
                          value: '{"selects":[[4,1,1,2,1]]}'
          - wait_template: "{{ states(vac) == 'cleaning' }}"
            timeout: '00:04:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_x20
                  title: 'Пылесос X20+: остановлено'
                  message: "{{ phase }}: команда не принята, состояние {{ states(vac) }}, статус {{ states(st) }}."
              - stop: 'room start was not accepted'
                error: true
          - delay: '00:00:05'
          - action: xiaomi_miot.get_properties
            data:
              entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
              mapping:
                - siid: 2
                  piid: 3
                - siid: 4
                  piid: 5
            response_variable: props
          - if: "{{ (props['vacuum.mode'] | int(-1)) != 3 or (mop and (props['vacuum_extend.mop_mode'] | int(0)) != 3) }}"
            then:
              - action: vacuum.return_to_base
                target:
                  entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_x20
                  title: 'Пылесос X20+: остановлено'
                  message: "{{ phase }}: настройки комнаты в роботе не те (всасывание {{ props['vacuum.mode'] }}, вода {{ props['vacuum_extend.mop_mode'] }}), ожидалось 3 и {{ 3 if mop else 'любая' }}. Проверь Custom mode в Mi Home. Отправлен на базу."
              - stop: 'room settings in the robot are not the expected ones'
                error: true
          - wait_for_trigger:
              - trigger: state
                entity_id: sensor.xiaomi_c102gl_cadb_status
                to: 'dustcollecting'
                id: dust
              - trigger: state
                entity_id: sensor.xiaomi_c102gl_cadb_status
                to:
                  - 'charging'
                  - 'charging completed'
                for: '00:01:00'
                id: end
              - trigger: state
                entity_id: sensor.xiaomi_c102gl_cadb_status
                to: 'drying'
                for: '00:00:10'
                id: end
              - trigger: state
                entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                to: 'error'
                for: '00:02:00'
                id: err
            timeout: '01:30:00'
            continue_on_timeout: true
          - choose:
              - conditions: "{{ not wait.trigger or wait.trigger.id == 'err' or states(vac) == 'error' }}"
                sequence:
                  - action: vacuum.return_to_base
                    target:
                      entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                  - action: persistent_notification.create
                    data:
                      notification_id: vacuum_x20
                      title: 'Пылесос X20+: остановлено'
                      message: "{{ phase }}: не закончилась штатно (состояние {{ states(vac) }}, статус {{ states(st) }}, заряд {{ states(bat) }}%). Отправлен на базу."
                  - stop: 'room did not end normally'
                    error: true
              - conditions: "{{ wait.trigger.id == 'dust' }}"
                sequence:
                  - wait_for_trigger:
                      - trigger: state
                        entity_id: sensor.xiaomi_c102gl_cadb_status
                        to:
                          - 'charging'
                          - 'charging completed'
                        for: '00:01:00'
                        id: end
                      - trigger: state
                        entity_id: sensor.xiaomi_c102gl_cadb_status
                        to: 'drying'
                        for: '00:00:10'
                        id: end
                      - trigger: state
                        entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                        to: 'error'
                        for: '00:02:00'
                        id: err
                    timeout: '01:30:00'
                    continue_on_timeout: true
                  - if: "{{ not wait.trigger or wait.trigger.id == 'err' or states(vac) == 'error' }}"
                    then:
                      - action: vacuum.return_to_base
                        target:
                          entity_id: vacuum.xiaomi_c102gl_cadb_robot_cleaner
                      - action: persistent_notification.create
                        data:
                          notification_id: vacuum_x20
                          title: 'Пылесос X20+: остановлено'
                          message: "{{ phase }}: не закончилась штатно (состояние {{ states(vac) }}, статус {{ states(st) }}, заряд {{ states(bat) }}%). Отправлен на базу."
                      - stop: 'room did not end normally'
                        error: true
            default:
              # the room ended without the station ever emptying the bin: do it by hand (only while the robot simply sits charging)
              - if: "{{ states(st) in ['charging', 'charging completed'] }}"
                then:
                  - action: button.press
                    target:
                      entity_id: button.xiaomi_c102gl_cadb_start_dust_arrest
                  - wait_template: "{{ states(st) == 'dustcollecting' }}"
                    timeout: '00:01:30'
                    continue_on_timeout: true
                  - wait_template: "{{ states(st) in ['charging', 'charging completed'] }}"
                    timeout: '00:10:00'
                    continue_on_timeout: true
          - action: logbook.log
            data:
              name: 'Vacuum X20'
              message: "{{ phase }} (id {{ rid }}): готово. Счётчики: время {{ states('sensor.xiaomi_c102gl_cadb_cleaning_time') }} мин, площадь {{ states('sensor.xiaomi_c102gl_cadb_cleaning_area') }}, заряд {{ states(bat) }}%."
          - delay: '00:00:10'
    # the end of the whole task: wash the mop and let the station dry it (unless the station already does it by itself)
    - if: "{{ (todo | selectattr('mop') | list | count) > 0 and states(st) != 'drying' and states(st) in ['charging', 'charging completed'] }}"
      then:
        - action: button.press
          target:
            entity_id: button.xiaomi_c102gl_cadb_start_mop_wash
        - wait_template: "{{ states(st) in ['washing', 'go washing', 'washingmoppause'] }}"
          timeout: '00:01:30'
          continue_on_timeout: true
        - wait_for_trigger:
            - trigger: state
              entity_id: sensor.xiaomi_c102gl_cadb_status
              to:
                - 'charging'
                - 'charging completed'
              for: '00:01:00'
            - trigger: state
              entity_id: sensor.xiaomi_c102gl_cadb_status
              to: 'drying'
              for: '00:00:10'
          timeout: '00:40:00'
          continue_on_timeout: true
        - if: "{{ states(st) != 'drying' }}"
          then:
            - action: button.press
              target:
                entity_id: button.xiaomi_c102gl_cadb_start_dry
            - wait_template: "{{ states(st) == 'drying' }}"
              timeout: '00:02:00'
              continue_on_timeout: true
            - if: "{{ not wait.completed }}"
              then:
                - action: persistent_notification.create
                  data:
                    notification_id: vacuum_x20
                    title: 'Пылесос X20+: сушка не началась'
                    message: "Уборка закончена, но станция не начала сушить тряпку (статус {{ states(st) }})."
    - action: logbook.log
      data:
        name: 'Vacuum X20'
        message: 'ПЛАН ВЫПОЛНЕН'
    - action: persistent_notification.create
      data:
        notification_id: vacuum_x20
        title: 'Пылесос X20+: план выполнен'
        message: "Комнаты убраны: {{ todo | map(attribute='name') | join(', ') }}. Станция {{ 'сушит тряпку' if states(st) == 'drying' else 'не сушит' }}."
