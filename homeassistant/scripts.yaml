# Task 25 Phase C — reconciliation scripts. Called on HA start and on plug reconnect.
# Each script checks the current time against the schedule window and corrects the plug.

reconcile_all_plugs:
  alias: 'Reconcile all scheduled plugs to current schedule'
  sequence:
    - service: script.reconcile_bathroom_towels
    - service: script.reconcile_plant_lights
    - service: script.reconcile_parrot

reconcile_bathroom_towels:
  alias: 'Reconcile bathroom_towels to schedule'
  sequence:
    - variables:
        t: "{{ now().hour * 60 + now().minute }}"
        target: >
          {{ 'on' if (t >= 390 and t < 480) or (t >= 1110 and t < 1200) else 'off' }}
        cur: "{{ states('switch.bathroom_towels') }}"
    - if:
        - condition: template
          value_template: "{{ target == 'on' and cur not in ['on', 'unavailable'] }}"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.bathroom_towels
        - service: logbook.log
          data:
            name: Reconcile
            message: "bathroom_towels: {{ cur }} → ON (schedule window)"
    - if:
        - condition: template
          value_template: "{{ target == 'off' and cur == 'on' }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.bathroom_towels
        - service: logbook.log
          data:
            name: Reconcile
            message: "bathroom_towels: on → OFF (outside schedule window)"

reconcile_plant_lights:
  alias: 'Reconcile all plant lights (Rack1/Rack2/Orchids) to schedule'
  sequence:
    - variables:
        t: "{{ now().hour * 60 + now().minute }}"
        target: >
          {{ 'on' if (t >= 420 and t < 1200) else 'off' }}
    - repeat:
        for_each:
          - switch.living_room_rack
          - switch.livingroom_rack_big
          - switch.kitchen_orchids
          - switch.minisserver
        sequence:
          - variables:
              cur: "{{ states(repeat.item) }}"
          - if:
              - condition: template
                value_template: "{{ target == 'on' and cur not in ['on', 'unavailable'] }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ repeat.item }}"
              - service: logbook.log
                data:
                  name: Reconcile
                  message: "{{ repeat.item }}: {{ cur }} → ON (schedule window)"
          - if:
              - condition: template
                value_template: "{{ target == 'off' and cur == 'on' }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: "{{ repeat.item }}"
              - service: logbook.log
                data:
                  name: Reconcile
                  message: "{{ repeat.item }}: on → OFF (outside schedule window)"

reconcile_parrot:
  alias: 'Reconcile bedroom_parrot to schedule'
  sequence:
    - variables:
        t: "{{ now().hour * 60 + now().minute }}"
        target: >
          {{ 'on' if (t >= 660 and t < 1080) else 'off' }}
        cur: "{{ states('switch.bedroom_parrot') }}"
    - if:
        - condition: template
          value_template: "{{ target == 'on' and cur not in ['on', 'unavailable'] }}"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.bedroom_parrot
        - service: logbook.log
          data:
            name: Reconcile
            message: "bedroom_parrot: {{ cur }} → ON (schedule window)"
    - if:
        - condition: template
          value_template: "{{ target == 'off' and cur == 'on' }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.bedroom_parrot
        - service: logbook.log
          data:
            name: Reconcile
            message: "bedroom_parrot: on → OFF (outside schedule window)"

# ── Robot vacuum H40 Livingroom: rooms one by one, dust emptied after each (manual start only) ──
# Order: Koridor 10, Bathroom 9, Living room 13, Kitchen 8 (room 11 has no name and is not cleaned).
# Per room: start -> wait for sweeping -> wait for dock -> wait for the station to empty the bin
# (status stationworking; if it does not start by itself, press Start Dust Arrest) -> next room.
# Room ids are literal strings in params: a templated "[10]" is parsed by HA into a list and the robot ignores it.
# Aborting: stop the script (Settings > Scripts). Returning the robot to base by hand counts as "room done".
vacuum_livingroom_rooms:
  alias: 'Vacuum Livingroom: rooms one by one, empty dust after each'
  mode: single
  max_exceeded: silent
  variables:
    st: sensor.xiaomi_ov51gl_b5f6_status
    bat: sensor.xiaomi_ov51gl_b5f6_battery_level
    vac: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
    area: sensor.xiaomi_ov51gl_b5f6_cleaning_area
    ctime: sensor.xiaomi_ov51gl_b5f6_cleaning_time
  sequence:
    - if: "{{ states(st) not in ['charging', 'charged'] }}"
      then:
        - action: persistent_notification.create
          data:
            notification_id: vacuum_livingroom
            title: 'Пылесос (гостиная): не запущено'
            message: "Пылесос должен стоять на базе, сейчас статус {{ states(st) }}."
        - stop: 'vacuum is not docked'
          error: true
    - repeat:
        for_each: [10, 9, 13, 8]
        sequence:
          - variables:
              room_name: "{{ {8: 'Кухня', 9: 'Ванная', 10: 'Коридор', 13: 'Гостиная'}[repeat.item] }}"
          # enough battery for a room
          - if: "{{ states(bat) | float(0) < 50 }}"
            then:
              - wait_template: "{{ states(bat) | float(0) >= 50 }}"
                timeout: '01:30:00'
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: vacuum_livingroom
                      title: 'Пылесос (гостиная): остановлено'
                      message: "{{ room_name }}: заряд {{ states(bat) }}% за 90 минут не дошёл до 50%."
                  - stop: 'battery did not reach 50 %'
                    error: true
          # start exactly this room
          - choose:
              - conditions: "{{ repeat.item == 10 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[10]"]
              - conditions: "{{ repeat.item == 9 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[9]"]
              - conditions: "{{ repeat.item == 13 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[13]"]
              - conditions: "{{ repeat.item == 8 }}"
                sequence:
                  - action: xiaomi_miot.call_action
                    data:
                      entity_id: vacuum.xiaomi_ov51gl_b5f6_robot_cleaner
                      siid: 2
                      aiid: 16
                      params: ["[8]"]
          - wait_template: "{{ states(st) == 'sweeping' }}"
            timeout: '00:03:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_livingroom
                  title: 'Пылесос (гостиная): остановлено'
                  message: "{{ room_name }}: команда не принята, статус {{ states(st) }}."
              - stop: 'room start was not accepted'
                error: true
          # cleaning until it is back on the dock (a manual pause or a stuck robot just waits; ha-alerts reports it)
          - wait_template: "{{ states(st) in ['charging', 'charged'] or states(vac) == 'error' }}"
            timeout: '01:30:00'
            continue_on_timeout: true
          - if: "{{ not wait.completed or states(vac) == 'error' }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: vacuum_livingroom
                  title: 'Пылесос (гостиная): остановлено'
                  message: "{{ room_name }}: не вернулся на базу (статус {{ states(st) }}, состояние {{ states(vac) }})."
              - stop: 'robot did not return to the dock'
                error: true
          - variables:
              area_raw: "{{ states(area) }}"
              time_raw: "{{ states(ctime) }}"
          # dust emptying: the station usually starts about 10 s after docking (status stationworking, ~11 s)
          - wait_template: "{{ states(st) == 'stationworking' }}"
            timeout: '00:01:30'
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
              - action: button.press
                target:
                  entity_id: button.xiaomi_ov51gl_b5f6_start_dust_arrest
              - wait_template: "{{ states(st) == 'stationworking' }}"
                timeout: '00:02:00'
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: vacuum_livingroom
                      title: 'Пылесос (гостиная): остановлено'
                      message: "{{ room_name }}: станция не начала опорожнение даже по команде."
                  - stop: 'station did not empty the bin'
                    error: true
          - wait_template: "{{ states(st) in ['charging', 'charged'] }}"
            timeout: '00:03:00'
            continue_on_timeout: true
          - action: logbook.log
            data:
              name: 'Vacuum Livingroom'
              message: "{{ room_name }} (id {{ repeat.item }}): убрано, мусор сброшен. Счётчик площади {{ area_raw }}, время {{ time_raw }} с."
          - delay: '00:00:10'
    - action: persistent_notification.create
      data:
        notification_id: vacuum_livingroom
        title: 'Пылесос (гостиная): уборка завершена'
        message: 'Коридор, ванная, гостиная и кухня убраны, мусор сбрасывался после каждой комнаты.'
