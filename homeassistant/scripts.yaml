# Task 25 Phase C — reconciliation scripts. Called on HA start and on plug reconnect.
# Each script checks the current time against the schedule window and corrects the plug.

reconcile_all_plugs:
  alias: 'Reconcile all scheduled plugs to current schedule'
  sequence:
    - service: script.reconcile_bathroom_towels
    - service: script.reconcile_plant_lights
    - service: script.reconcile_parrot

reconcile_bathroom_towels:
  alias: 'Reconcile bathroom_towels to schedule'
  sequence:
    - variables:
        t: "{{ now().hour * 60 + now().minute }}"
        target: >
          {{ 'on' if (t >= 390 and t < 480) or (t >= 1110 and t < 1200) else 'off' }}
        cur: "{{ states('switch.bathroom_towels') }}"
    - if:
        - condition: template
          value_template: "{{ target == 'on' and cur not in ['on', 'unavailable'] }}"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.bathroom_towels
        - service: logbook.log
          data:
            name: Reconcile
            message: "bathroom_towels: {{ cur }} → ON (schedule window)"
    - if:
        - condition: template
          value_template: "{{ target == 'off' and cur == 'on' }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.bathroom_towels
        - service: logbook.log
          data:
            name: Reconcile
            message: "bathroom_towels: on → OFF (outside schedule window)"

reconcile_plant_lights:
  alias: 'Reconcile all plant lights (Rack1/Rack2/Orchids) to schedule'
  sequence:
    - variables:
        t: "{{ now().hour * 60 + now().minute }}"
        target: >
          {{ 'on' if (t >= 420 and t < 1200) else 'off' }}
    - repeat:
        for_each:
          - switch.living_room_rack
          - switch.livingroom_rack_big
          - switch.kitchen_orchids
        sequence:
          - variables:
              cur: "{{ states(repeat.item) }}"
          - if:
              - condition: template
                value_template: "{{ target == 'on' and cur not in ['on', 'unavailable'] }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ repeat.item }}"
              - service: logbook.log
                data:
                  name: Reconcile
                  message: "{{ repeat.item }}: {{ cur }} → ON (schedule window)"
          - if:
              - condition: template
                value_template: "{{ target == 'off' and cur == 'on' }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: "{{ repeat.item }}"
              - service: logbook.log
                data:
                  name: Reconcile
                  message: "{{ repeat.item }}: on → OFF (outside schedule window)"

reconcile_parrot:
  alias: 'Reconcile bedroom_parrot to schedule'
  sequence:
    - variables:
        t: "{{ now().hour * 60 + now().minute }}"
        target: >
          {{ 'on' if (t >= 660 and t < 1080) else 'off' }}
        cur: "{{ states('switch.bedroom_parrot') }}"
    - if:
        - condition: template
          value_template: "{{ target == 'on' and cur not in ['on', 'unavailable'] }}"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.bedroom_parrot
        - service: logbook.log
          data:
            name: Reconcile
            message: "bedroom_parrot: {{ cur }} → ON (schedule window)"
    - if:
        - condition: template
          value_template: "{{ target == 'off' and cur == 'on' }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.bedroom_parrot
        - service: logbook.log
          data:
            name: Reconcile
            message: "bedroom_parrot: on → OFF (outside schedule window)"
