# ── Reconciliation: on HA start ──────────────────────────────────────────────
- id: reconcile_all_on_start
  alias: 'Reconcile: all plugs on HA start'
  trigger:
    - platform: homeassistant
      event: start
  action:
    - service: script.reconcile_all_plugs

# ── Reconciliation: on plug reconnect (unavailable → any state) ──────────────
- id: reconcile_bathroom_towels_reconnect
  alias: 'Reconcile: bathroom_towels on reconnect'
  trigger:
    - platform: state
      entity_id: switch.bathroom_towels
      from: "unavailable"
  action:
    - service: script.reconcile_bathroom_towels

- id: reconcile_orchids_reconnect
  alias: 'Reconcile: Orchids on reconnect'
  trigger:
    - platform: state
      entity_id: switch.kitchen_orchids
      from: "unavailable"
  action:
    - service: script.reconcile_plant_lights

- id: reconcile_parrot_reconnect
  alias: 'Reconcile: Parrot UV on reconnect'
  trigger:
    - platform: state
      entity_id: switch.bedroom_parrot
      from: "unavailable"
  action:
    - service: script.reconcile_parrot

# ── Robot vacuum H40 Livingroom: the whole plan every day at 20:30 (Ivan, 2026-10-16) ──
- id: sched_vacuum_livingroom_plan
  alias: 'Schedule: Livingroom vacuum plan 20:30'
  mode: single
  trigger:
    - platform: time
      at: '20:30:00'
  action:
    - action: script.turn_on
      target:
        entity_id: script.vacuum_livingroom_plan

# ── Robot vacuum H40 Bedroom: morning Silent vacuum 09:00, evening Turbo vacuum + mop Level3 19:00 (Ivan, 2026-10-16) ──
- id: sched_vacuum_bedroom_morning
  alias: 'Schedule: Bedroom vacuum morning 09:00'
  mode: single
  trigger:
    - platform: time
      at: '09:00:00'
  action:
    - action: script.turn_on
      target:
        entity_id: script.vacuum_bedroom_plan
      data:
        variables:
          plan: morning

- id: sched_vacuum_bedroom_evening
  alias: 'Schedule: Bedroom vacuum + mop evening 19:00'
  mode: single
  trigger:
    - platform: time
      at: '19:00:00'
  action:
    - action: script.turn_on
      target:
        entity_id: script.vacuum_bedroom_plan
      data:
        variables:
          plan: evening

# ── Portal (Task 27): the one way the host-side applier reaches Home Assistant. Static and hand-written on purpose: it contains no time and no
# schedule, only "reload what is in generated/". local_only: only requests from this machine's own network are accepted; the webhook id is a
# secret (secrets.yaml, not in git). script.reload first, automation.reload last: the automation reload replaces this very automation.
- id: portal_apply_reload
  alias: 'Portal: reload generated schedules (webhook)'
  mode: single
  trigger:
    - platform: webhook
      webhook_id: !secret portal_reload_webhook
      allowed_methods: [POST]
      local_only: true
  action:
    - service: script.reload
    - service: automation.reload
