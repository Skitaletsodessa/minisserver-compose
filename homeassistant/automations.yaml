# Task 25 Phase C — plug schedules + reconciliation. One automation per schedule edge.
# TEST automations at bottom — REMOVE after verification (switch.living_room_rack / Rack1).

# ── BathroomTowels (.240): ON 06:30, OFF 08:00, ON 18:30, OFF 20:00 ──────────
- id: sched_bathroom_towels_on_morning
  alias: 'Schedule: bathroom_towels ON 06:30'
  mode: single
  trigger:
    - platform: time
      at: '06:30:00'
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.bathroom_towels

- id: sched_bathroom_towels_off_morning
  alias: 'Schedule: bathroom_towels OFF 08:00'
  mode: single
  trigger:
    - platform: time
      at: '08:00:00'
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.bathroom_towels

- id: sched_bathroom_towels_on_evening
  alias: 'Schedule: bathroom_towels ON 18:30'
  mode: single
  trigger:
    - platform: time
      at: '18:30:00'
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.bathroom_towels

- id: sched_bathroom_towels_off_evening
  alias: 'Schedule: bathroom_towels OFF 20:00'
  mode: single
  trigger:
    - platform: time
      at: '20:00:00'
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.bathroom_towels

# ── Plant lights: Rack1 (.241), Rack2 (.242), Orchids (.243): ON 07:00, OFF 20:00 ──
- id: sched_plant_lights_on
  alias: 'Schedule: plant lights ON 07:00'
  mode: single
  trigger:
    - platform: time
      at: '07:00:00'
  action:
    - service: switch.turn_on
      target:
        entity_id:
          - switch.living_room_rack
          - switch.livingroom_rack_big
          - switch.kitchen_orchids
          - switch.minisserver

- id: sched_plant_lights_off
  alias: 'Schedule: plant lights OFF 20:00'
  mode: single
  trigger:
    - platform: time
      at: '20:00:00'
  action:
    - service: switch.turn_off
      target:
        entity_id:
          - switch.living_room_rack
          - switch.livingroom_rack_big
          - switch.kitchen_orchids
          - switch.minisserver

# ── Bedroom Parrot UV (.245): ON 11:00, OFF 18:00 ───────────────────────────
- id: sched_parrot_uv_on
