# Hand-written Home Assistant automations. Since Task 27 (2026-10-19) NO SCHEDULE lives here: every plug window, fail-safe OFF,
# reconcile-on-reconnect and vacuum-plan trigger is GENERATED from the schedule service into generated/automations/ (see
# portal/schedules/README.md; change a schedule with `schedctl`, never by editing YAML). What stays hand-written contains no time:
# the start-up reconcile and the reload hook the host-side applier uses. The original file is portal/schedules/baseline/automations.yaml.

# ── Reconciliation: on HA start (calls script.reconcile_all_plugs -> script.sch_reconcile_all, generated) ──
- id: reconcile_all_on_start
  alias: 'Reconcile: all plugs on HA start'
  trigger:
    - platform: homeassistant
      event: start
  action:
    - service: script.reconcile_all_plugs

# ── Portal (Task 27): the one way the host-side applier reaches Home Assistant. Static and hand-written on purpose: it contains no time and no
# schedule, only "reload what is in generated/". local_only: only requests from this machine's own network are accepted; the webhook id is a
# secret (secrets.yaml, not in git). script.reload first, automation.reload last: the automation reload replaces this very automation.
- id: portal_apply_reload
  alias: 'Portal: reload generated schedules (webhook)'
  mode: single
  trigger:
    - platform: webhook
      webhook_id: !secret portal_reload_webhook
      allowed_methods: [POST]
      local_only: true
  action:
    - service: script.reload
    - service: automation.reload
