# ── Reconciliation: on HA start ──────────────────────────────────────────────
- id: reconcile_all_on_start
  alias: 'Reconcile: all plugs on HA start'
  trigger:
    - platform: homeassistant
      event: start
  action:
    - service: script.reconcile_all_plugs

# ── Reconciliation: on plug reconnect (unavailable → any state) ──────────────
- id: reconcile_bathroom_towels_reconnect
  alias: 'Reconcile: bathroom_towels on reconnect'
  trigger:
    - platform: state
      entity_id: switch.bathroom_towels
      from: "unavailable"
  action:
    - service: script.reconcile_bathroom_towels

- id: reconcile_rack1_reconnect
  alias: 'Reconcile: Rack1 on reconnect'
  trigger:
    - platform: state
      entity_id: switch.living_room_rack
      from: "unavailable"
  action:
    - service: script.reconcile_plant_lights

- id: reconcile_rack2_reconnect
  alias: 'Reconcile: Rack2 on reconnect'
  trigger:
    - platform: state
      entity_id: switch.livingroom_rack_big
      from: "unavailable"
  action:
    - service: script.reconcile_plant_lights

- id: reconcile_orchids_reconnect
  alias: 'Reconcile: Orchids on reconnect'
  trigger:
    - platform: state
      entity_id: switch.kitchen_orchids
      from: "unavailable"
  action:
    - service: script.reconcile_plant_lights

- id: reconcile_parrot_reconnect
  alias: 'Reconcile: Parrot UV on reconnect'
  trigger:
    - platform: state
      entity_id: switch.bedroom_parrot
      from: "unavailable"
  action:
    - service: script.reconcile_parrot

- id: reconcile_minisserver_reconnect
  alias: 'Reconcile: minisserver on reconnect'
  trigger:
    - platform: state
      entity_id: switch.minisserver
      from: "unavailable"
  action:
    - service: script.reconcile_plant_lights

# ── Robot vacuum H40 Livingroom: the whole plan every day at 20:30 (Ivan, 2026-10-16) ──
- id: sched_vacuum_livingroom_plan
  alias: 'Schedule: Livingroom vacuum plan 20:30'
  mode: single
  trigger:
    - platform: time
      at: '20:30:00'
  action:
    - action: script.turn_on
      target:
        entity_id: script.vacuum_livingroom_plan
