# Home Assistant configuration — in git; no secrets here.
# Secrets live in /config/secrets.yaml (git-ignored, restic-backed).

homeassistant:
  external_url: "https://minisserver.tail6bf4d5.ts.net:15443"
  internal_url: "http://127.0.0.1:8123"

default_config:

http:
  server_host: 127.0.0.1
  server_port: 8123
  ip_ban_enabled: false

recorder:
  purge_keep_days: 10
  commit_interval: 30
  # xiaomi_miot "Info" buttons rewrite a ~10 kB attribute dict every few seconds: 43k rows and ~345 MiB in two days
  # (found 2026-10-16). They carry no history worth keeping; the entities themselves are untouched.
  exclude:
    entity_globs:
      - button.*_info

logger:
  default: warning

# Task 27 (portal-schedules): the schedules are rendered from one source of truth into generated/ by the host-side applier.
# Hand-written items stay in automations.yaml / scripts.yaml. 'webhook:' is explicit because the applier's reload trigger is a webhook.
webhook:
automation manual: !include automations.yaml
automation generated: !include_dir_merge_list generated/automations/
script manual: !include scripts.yaml
script generated: !include_dir_merge_named generated/scripts/
