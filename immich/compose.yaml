# Immich v3.2.2 - adapted from the official docker-compose.yml of that release
# (https://raw.githubusercontent.com/immich-app/immich/v3.2.2/docker/docker-compose.yml).
# Differences from upstream, and why (report-08.md):
#   - LAN binding on 192.168.31.2 instead of 0.0.0.0 (Caddy fronts it on the tailnet)
#   - thumbs/ and encoded-video/ mounted separately onto the NVMe /srv/apps (rebuildable, never backed up)
#   - upload/library/profile stay in UPLOAD_LOCATION on /srv/data (Tier-1, NVMe)
#   - VAAPI device for transcoding (same device Jellyfin uses), settings in immich-config.json
#   - restart policy unless-stopped, like every other stack here
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?set IMMICH_VERSION in .env}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${UPLOAD_LOCATION:?}:/data
      - ${THUMB_LOCATION:?}:/data/thumbs
      - ${ENCODED_VIDEO_LOCATION:?}:/data/encoded-video
      - ./immich-config.json:/config/immich-config.json:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      IMMICH_CONFIG_FILE: /config/immich-config.json
    ports:
      - '192.168.31.2:2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - ${ML_CACHE_LOCATION:?}:/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:?}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
