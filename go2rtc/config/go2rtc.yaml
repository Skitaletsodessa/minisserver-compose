# Task 34. Credentials come from the git-ignored .env (${VAR} is expanded by go2rtc); nothing secret in this file.
api:
  listen: ":1984"          # container-internal; published to 127.0.0.1:18984 only
  origin: ""               # no CORS: only the gateway (same host) talks to it
rtsp:
  listen: ":8554"          # container-internal; published to 127.0.0.1:18554 only
webrtc:
  listen: ""               # off (no UDP/TCP 8555)
srtp:
  listen: ""               # off (no 8443)
log:
  level: info
streams:
  # ch0 (the PTZ) over RTSP, sub stream; ch1/ch2 (IPC_01, IPC_02) are not reachable over RTSP, only DVRIP (0-based channel, subtype 1 = sub stream)
  cam_ch0: ${CAM95_RTSP_SUB}
  cam_ch1: ${CAM95_DVRIP_CH1}
  cam_ch2: ${CAM95_DVRIP_CH2}
  # H.264 versions for browsers/WebViews without HEVC: transcoded by go2rtc (software x264, 640x360), started only while someone watches
  cam_ch0_h264: ffmpeg:cam_ch0#video=h264
  cam_ch1_h264: ffmpeg:cam_ch1#video=h264
  cam_ch2_h264: ffmpeg:cam_ch2#video=h264
  # Main streams (Task 34b): the full-screen "HD" view, TAILNET ONLY (the gateway refuses quality=hd through the public door). ch0 main = 2560x1440 H.265 over RTSP,
  # ch1/ch2 main = 1920x1080 over DVRIP. The browser gets H.264 scaled to 720p (software x264; one stream at a time).
  cam_ch0_hd: ${CAM95_RTSP_MAIN}
  cam_ch1_hd: ${CAM95_DVRIP_HD1}
  cam_ch2_hd: ${CAM95_DVRIP_HD2}
  cam_ch0_hd_h264: ffmpeg:cam_ch0_hd#video=h264#height=720
  cam_ch1_hd_h264: ffmpeg:cam_ch1_hd#video=h264#height=720
  cam_ch2_hd_h264: ffmpeg:cam_ch2_hd#video=h264#height=720
