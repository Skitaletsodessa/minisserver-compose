# ── Home Assistant's discovery sockets (host network): SSDP and mDNS. They answer the LAN; HA itself serves HTTP on 127.0.0.1 only ──
udp * 1900             python3       HA SSDP discovery (verified: owner is the HA container's python3)
udp * 5353             python3       HA mDNS/zeroconf (wildcard)
udp 192.168.31.2 5353  python3       HA mDNS/zeroconf on the LAN address
udp fe80::5a47:caff:fe74:e255 5353 python3  HA mDNS/zeroconf on the link-local address of eno1
udp * ephemeral        python3       HA discovery: two random-port UDP sockets (59885, 40687 at the time of writing). UNVERIFIED which integration owns each; python3 is also used by other containers, so this entry is as wide as "any python3 wildcard UDP socket in the ephemeral range"

