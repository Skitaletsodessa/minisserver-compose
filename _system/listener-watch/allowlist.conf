# Expected NON-loopback listening sockets of minisserver (Task 27a item 3). Built from `ss -tulnp` on 2026-10-20 and reviewed entry by entry.
# Format: PROTO ADDRESS PORT PROCESS [until=YYYY-MM-DD] REASON      (ADDRESS * = every address: 0.0.0.0, [::], *; PORT ephemeral = >= 32768, changes at each start)
# A listener that matches nothing here raises a tier-A alert. Loopback (127.*, ::1) is never checked. To add a listener: add a line WITH a reason.
# Status words in the reason: "verified" = checked against the config/process; "unverified" = plausible, not individually proven (listed for Ivan).

# ── remote administration ──
tcp *  22   sshd          SSH, key-only (passwords disabled), LAN + tailnet administration (verified: sshd_config.d)

