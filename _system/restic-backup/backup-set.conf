# THE backup set: everything this machine knows that exists nowhere else. One file, in git.
# Adding to the set is one line here (Task 08 adds the Immich Postgres dump, smart-home adds
# Home Assistant + Zigbee2MQTT config). Read by restic-backup.sh and backup-dump.sh.
# Scope reasoning: docs/report-06.md. Do NOT add the library, caches or anything renewable.
#
# Fields are whitespace-separated; paths must not contain spaces.
#
#   path        <path>                  backed up as files, to BOTH repositories
#   path-local  <path>                  local repository only (see /srv/data below)
#   exclude     <pattern>               restic --exclude (absolute paths, * globs)
#   sqlite      <name> <file>           LIVE SQLite DB: consistent copy via `sqlite3 .backup` (no
#                                       downtime, integrity_check-verified) into the staging dir;
#                                       the live file (+ -wal/-shm) is excluded below
#   exclude-local <pattern>             like exclude, but for the local /srv/data snapshot only
#   pgdump      <name> <container> <pguser> <db>  LIVE PostgreSQL: pg_dump from the running container
#                                       into the staging dir (gzip + completion trailer verified)
#   stopcopy    <name> <container> <dir> <health-url>  live non-SQLite state (InfluxDB): stop the container for
#                                       the seconds a copy takes, copy, start it, verify <health-url> answers
#
# A live database file is never copied while its owner is running.

# --- /srv/compose incl. git-ignored files: every .env, TLS keys. Git holds the structure only.
path        /srv/compose
# restic-r2.env holds the R2 keys+password: they live in Ivan's password manager by design, and a
# repository that contains its own key file is circular. Excluded from both repositories.
exclude     /srv/compose/_system/restic-r2.env

# --- Host configuration (live files behind host/MANIFEST.md, plus sshd hardening and the
#     unit-enablement symlinks, which the host/ mirror does not carry)
path        /etc/fstab
path        /etc/default/zramswap
path        /etc/udev/rules.d
path        /etc/systemd/system.conf.d
path        /etc/systemd/system
path        /etc/docker/daemon.json
path        /etc/samba/smb.conf
path        /etc/network/interfaces
path        /etc/ssh/sshd_config.d
path        /etc/sudoers.d
# skit's authorized_keys, ssh config and the GitHub deploy key for /srv/compose (a secret that
# exists only on this box; the repo is encrypted, its password is off-machine)
path        /home/skit/.ssh

# --- smart-change-watch baselines (its "alert on change" is meaningless without them)
path        /var/lib/smart-change-watch

# --- Scrutiny: the only long-run SMART history of these drives
sqlite      scrutiny          /srv/apps/docker/volumes/scrutiny_scrutiny-config/_data/scrutiny.db
stopcopy    scrutiny-influxdb scrutiny /srv/apps/docker/volumes/scrutiny_scrutiny-influxdb/_data http://127.0.0.1:8080/api/health

# --- Jellyfin: config, users, restrictions, watch history. NOT metadata/, log/ or the caches.
path        /srv/apps/jellyfin/config
sqlite      jellyfin          /srv/apps/jellyfin/config/data/jellyfin.db
exclude     /srv/apps/jellyfin/config/metadata
exclude     /srv/apps/jellyfin/config/log
exclude     /srv/apps/jellyfin/config/data/jellyfin.db*

# --- Navidrome: users and play history. NOT cache/.
path        /srv/apps/navidrome
sqlite      navidrome         /srv/apps/navidrome/navidrome.db
exclude     /srv/apps/navidrome/cache
exclude     /srv/apps/navidrome/navidrome.db*

# --- qBittorrent: categories and settings. The torrents themselves are renewable.
path        /srv/apps/docker/volumes/qbittorrent_qbittorrent-config/_data/qBittorrent
exclude     /srv/apps/docker/volumes/qbittorrent_qbittorrent-config/_data/qBittorrent/BT_backup
exclude     /srv/apps/docker/volumes/qbittorrent_qbittorrent-config/_data/qBittorrent/GeoDB
exclude     /srv/apps/docker/volumes/qbittorrent_qbittorrent-config/_data/qBittorrent/logs
exclude     /srv/apps/docker/volumes/qbittorrent_qbittorrent-config/_data/qBittorrent/lockfile
exclude     /srv/apps/docker/volumes/qbittorrent_qbittorrent-config/_data/qBittorrent/ipc-socket

# --- Immich (Task 08): everything the originals do not hold - albums, faces, partner links, date
#     corrections, the locked-folder index. The ORIGINALS are deliberately not here (see the
#     /srv/data block below). Thumbnails, encoded video and ML models are rebuildable, live on
#     /srv/apps and are in no backup. profile/ (user avatars, <1 MB) is referenced by the DB and
#     Immich's docs single it out for backup; the DB dump lands under backup-staging, below.
pgdump      immich immich_postgres postgres immich
path        /srv/data/immich/profile

# --- The consistent database copies made by backup-dump.sh (this is what restore reads, not the
#     live files excluded above). Root-only, on the NVMe, rebuilt every run.
path        /srv/apps/backup-staging

# --- Tier-1 (/srv/data): local repository only (its own snapshot, as before this task). Off-site
#     coverage of /srv/data (photos, Immich state) is a Task 08 decision and is not made here.
path-local  /srv/data
# ...except Immich's originals (~160 GB: they do not fit /srv/vault, 186 GiB shared, and live in
# Google Photos, on the desktop's E:\ and on a USB stick - decision recorded in tasks/task-08.md)
# and the live Postgres directory (a file copy of a running database is not a backup; the pg_dump
# above covers it). Immich's own DB dump directory is empty: its built-in backup is switched off
# in immich-config.json because this one replaces it.
exclude-local /srv/data/immich/library
exclude-local /srv/data/immich/upload
exclude-local /srv/data/immich-postgres
